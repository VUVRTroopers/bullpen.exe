          jsonBox.hidden = false; jsonBox.value = JSON.stringify({ pitcher: S.pitcher, arsenal: S.arsenal }, null, 1);
          try { await navigator.clipboard.writeText(jsonBox.value); BP.UI.toast('Arsenal copied as JSON'); } catch (e) { jsonBox.select(); BP.UI.toast('Select and copy the JSON below'); }
        } }, 'Export JSON'),
        h('button', { class: 'btn ghost', type: 'button', onclick: () => {
          if (jsonBox.hidden) { jsonBox.hidden = false; jsonBox.value = ''; jsonBox.placeholder = 'Paste arsenal JSON here, then press Import again'; return; }
          try { const o = JSON.parse(jsonBox.value); App.importArsenal(o); jsonBox.hidden = true; BP.UI.toast('Arsenal imported'); } catch (e) { BP.UI.toast('That JSON could not be read. Check that it came from Export.'); }
        } }, 'Import JSON')), jsonBox);
    function renderList() {

    tiltText.addEventListener('change', () => {

    const labSec = section('sec-lab', 'Pitch Lab', true,
      h('div', { class: 'pair' }, nameIn, typeSel),
      h('div', { class: 'sub' }, 'Grip & seams'),
      gripSel, gripNote,
      h('div', { class: 'ballwrap' }, ballCanvas, ballKV),
      slider(P('seamLat', { label: 'Axis latitude', min: -90, max: 90, step: 0.5, fmt: (v) => v.toFixed(1) + '<small>°</small>', hint: 'Where the spin axis pierces the leather (ball coordinates)' })),

  // grade a meter lock (presentation: the physics uses the continuous error)

  }
  function finishMeter() {
    const m = R.meter, E = R.E, cmd = CMD[App.S.command];
    const meterMs = (m.releaseLocked - m.releaseWindow) * 550;
    lockMeter(2, m.releaseLocked - m.releaseWindow, W.BANDS.release, `${Math.abs(meterMs).toFixed(0)} ms ${meterMs >= 0 ? 'late' : 'early'}`);
    const grades = m.locks.map((l) => l.grade);
    const nPerfect = grades.filter((g) => g === 'perfect').length;
    E.delivery = { grades, perfect: nPerfect };
    const vw = R.render.width, vr = document.getElementById('viewport').getBoundingClientRect(), mr = document.getElementById('hud-bc').getBoundingClientRect();
    const cy = mr.height ? mr.top - vr.top - 48 : R.render.height - 210, cx = mr.width ? mr.left - vr.left + mr.width / 2 : vw / 2;
    if (nPerfect === 3) {
      R.fx.callout({ title: 'Perfect delivery', cls: 'c-perfect', x: cx, y: cy, life: 1.6, rise: 18, essential: true });
      Audio.chord();
      R.fx.vignette('rgba(255,215,122,0.7)', 0.55, 0.7);
    } else if (!grades.includes('miss') && nPerfect >= 1) {
      R.fx.callout({ title: 'Clean delivery', cls: 'c-clean', x: cx, y: cy, life: 1.3, rise: 14, essential: true });
    }
    E.exec = {
      slotErr: (m.slotLocked - m.slotTarget) * 0.3 * cmd,
      pressureErr: U.clamp((m.pressureLocked - m.pressureTarget) * 1.2 * cmd, -1, 1),
      timingMs: meterMs * 0.06 * cmd,
    };
    m.releaseMs = E.exec.timingMs; m.stage = 4;
    m.doneT = 0;
    release();
  }

  function release() {
    const E = R.E, S = App.S, ctx = App.ctx();
    const exec = Object.assign({}, E.exec || {}, { target: E.target });
    E.thrown = Pitching.throwPitch(ctx, E.pitcher, E.pitch, exec);
    E.measure = Pitching.measureThrown(ctx, E.pitcher, E.thrown);
    const tr = E.thrown.traj;
    // the catcher's glove stops the ball ~0.65 m behind the plate
    E.tGlove = tr.T[tr.n - 1];
    for (let i = 0; i < tr.n; i++) if (tr.P[i * 3 + 1] < -0.62) { E.tGlove = tr.T[i]; break; }
    E.plateT = E.thrown.plate ? E.thrown.plate.t : E.tGlove;
    R.phase = 'flight'; R.t = 0; R.popped = false; R.cracked = false; R.whiffed = false; R.overWall = false;
    {
      const rel = [tr.P[0], tr.P[1], tr.P[2]];
      Audio.whip(E.thrown.releaseMph);
      const perfect = E.delivery && E.delivery.perfect === 3;
      if (E.rl.pitcherUser) {
        R.fx.flash(rel, { screen: perfect ? 0.06 : 0.035, life: 0.12, color: perfect ? 0xffd77a : 0xfff1d0, opacity: 0.85 });
        if (perfect) { R.fx.ring(rel, { screen: 0.01, to: 0.14, color: 0xffd77a, life: 0.35 }); R.fx.shake(0.02, 0.2, 0.02); }
      } else R.fx.flash(rel, { screen: 0.025, life: 0.1, opacity: 0.5 });
    }
    // CPU batter decides now, using only what it will have seen by its deadline
    if (E.batter && !E.rl.batterUser && E.mode === 'game') {
      const g = App.game;
      const dec = AI.batterDecide(ctx, E.thrown, E.batter, g.count, R.rng, gamePrior(), E.zone, cpuBat);
      E.cpuDec = dec;
      if (dec.swing) {
        E.sw = Batting.makeSwing({ hand: E.batter.hand, aim: dec.aim, attackDeg: dec.attackDeg, tClick: dec.tClick, type: dec.type }, E.batter, cpuBat);
        E.swBat = cpuBat;
        computeContact(E);
      }
    }
    if (E.sw && E.rl.batterUser) { computeContact(E); gradeSwing(E); } // swing started during the windup
    if (E.rl.pitcherUser && E.mode === 'bullpen') {
    }
    R.dirty = true;
  }

  function trySwing(tExact) {
    const E = R.E;
    if (!E || E.sw) return;
    if (!(R.phase === 'windup' || R.phase === 'flight')) return;
    const S = App.S;
    // timestamp the swing against the frame clock: input arrives between frames, and a 16 ms
    // frame is longer than the real timing window
    const tNow = tExact != null ? tExact : R.t + U.clamp((performance.now() - R.lastNow) / 1000, 0, 0.05) * S.simSpeed;
    if (R.phase === 'flight' && tNow > E.plateT + 0.03) return;
    const bat = App.bat();
    E.sw = Batting.makeSwing({ hand: S.batter.hand, aim: { x: R.aim.x, z: R.aim.z }, attackDeg: S.swing.attack, tClick: tNow, type: S.swing.type }, S.batter, bat);
    E.swBat = bat;
    Audio.whoosh(E.sw.Vss / U.MPH);
    if (E.thrown) { computeContact(E); gradeSwing(E); }
    R.dirty = true;
  }

  // how close was the swing start to a perfect interception? (feedback after commitment)
  function gradeSwing(E) {
    const sw = E.sw;
    if (!sw || !E.thrown || !E.rl.batterUser) return;
    const c = Aero.crossY(E.thrown.traj, sw.yc);
    if (!c) return;
    const dt = (sw.tClick - (c.t - sw.T)) * 1000;
    const a = Math.abs(dt);
    const g = a <= 5 ? { label: 'Perfect', color: '#ffd77a', tick: 'perfect' } : a <= 12 ? { label: 'Good', color: '#6cc08b', tick: 'great' } : { label: dt < 0 ? 'Early' : 'Late', color: a <= 30 ? '#d08a52' : '#ef6a57' };
    g.ms = dt;
    E.swingGrade = g;
    if (g.tick) Audio.tick(g.tick);
    E.cross = { p: c.p, t: c.t };
  }

  function computeContact(E) {
    const ctx = App.ctx();
    const con = Batting.findContact(ctx, E.thrown.traj, E.sw);
    if (!con) return;
    const hit = Batting.resolve(ctx, E.sw, con);
    if (!hit) return;
    E.hit = hit;
    E.bb = Batted.fly(ctx, hit, App.S.env.stadium);
    const st = E.mode === 'game' ? { outs: App.game.outs, bases: App.game.bases, hand: E.batter.hand } : { outs: 0, bases: [0, 0, 0], hand: E.batter.hand };
    E.play = Fielding.resolvePlay(E.bb, st, App.S.env.stadium);
    // when does the visual play end?
    let end = E.bb.traj.T[E.bb.traj.n - 1];
    const p = E.play;
    if (p.catchT) end = p.catchT + 0.6;
    for (const th of p.throws) end = Math.max(end, th.t1 + 0.4);
    for (const r of p.runners) end = Math.max(end, Math.min(r.t1, hit.t + 9) + 0.3);
    if (p.kind === 'HR') end = Math.max(end, E.bb.traj.T[E.bb.traj.n - 1] + 1.2, hit.t + 4.5);
    if (p.kind === 'FOUL') end = Math.min(end, hit.t + 3.2);
    E.playEnd = Math.min(end, hit.t + 14);
    R.dirty = true;
  }

  // ---------------------------------------------------------------- game-feel effects
  function contactGrade(E) {
    const hit = E.hit, bb = E.bb;
    const ev = bb.ev, la = bb.la;
    const maxEV = 1.23 * hit.batSpeedSS + 0.23 * (U.len(hit.vIn) / U.MPH);
    const sq = ev / maxEV;
    const foul = E.play && E.play.kind === 'FOUL';
    const barrel = ev >= 98 && la >= Math.max(8, 26 - (ev - 98)) && la <= Math.min(50, 30 + (ev - 98) * 1.2);
    let key = 'solid', label = 'Solid';
    if (hit.broke) { key = 'broken'; label = 'Broken bat'; }
    else if (barrel && !foul) { key = 'barrel'; label = 'Barreled'; }
    else if (sq >= 0.9) { key = 'squared'; label = 'Squared up'; }
    else if (hit.fromSweet < -4.5) { key = 'weak'; label = 'Jammed'; }
    else if (hit.inFromTip < 3) { key = 'weak'; label = 'Off the end'; }
    else if (la < -10) { key = ev >= 95 ? 'solid' : 'weak'; label = ev >= 95 ? 'Hard grounder' : 'Topped'; }
    else if (la > 50) { key = 'weak'; label = 'Got under it'; }
    else if (ev < 88) { key = 'weak'; label = 'Weak contact'; }
    if (foul && key !== 'barrel' && key !== 'squared') key = 'foul';
    const k = U.clamp((ev - 65) / 45, 0, 1) * (0.55 + 0.45 * U.clamp(sq, 0, 1));
    return { key, label, k, barrel, sq, ev, la, foul };
  }

  function contactFX(E, replay) {
    const fx = R.fx, hit = E.hit, S = App.S;
    const gr = contactGrade(E);
    E.grade = gr;
    const p = hit.p, dir = U.norm(hit.vOut), k = gr.k;
    const q = U.clamp((E.bb.ev - 60) / 50, 0, 1);
    Audio.crack(q, hit.broke, { barrel: gr.barrel });
    // impact: flash, shockwave, sparks along the exit direction, leather dust
    const hot = gr.barrel ? 0xffd77a : 0xfff1d0;
    fx.flash(p, { screen: 0.05 + 0.08 * k, life: 0.1 + 0.07 * k, color: hot, grow: 1.5 });
    fx.ring(p, { screen: 0.015, to: 0.16 + 0.2 * k, color: hot, life: 0.3 + 0.1 * k, opacity: 0.85 });
    fx.burst(p, { count: Math.round(10 + 30 * k), dir, spread: 0.85, speed: 4 + 10 * k, life: 0.28 + 0.12 * k, size: 0.035, color: hot, gravity: 3, drag: 3 });
    fx.burst(p, { count: 10, speed: 1.3, life: 0.6, size: 0.07, color: 0xd9ccb2, additive: false, gravity: 0.6, drag: 3, grow: 1.6, opacity: 0.55 });
    if (hit.broke) fx.burst(p, { count: 22, speed: 5.5, life: 1.1, size: 0.03, color: 0xd9b886, additive: false, gravity: 9.8, drag: 0.8, opacity: 1 });
    if (replay) return;
    // hit-stop & slow motion (presentation only)
    if (fx.on) R.freeze = fx.full ? 0.045 + 0.075 * k : 0.03;
    if (fx.full && (gr.barrel || (gr.key === 'squared' && k > 0.75))) R.slow = { t: 0, dur: 0.6, min: 0.28 };
    fx.shake(0.012 + 0.035 * k, 0.22 + 0.18 * k, 0.015 + 0.045 * k);
    if (gr.barrel) fx.vignette('rgba(255,200,110,0.75)', 0.6, 0.6);
    else if (gr.key === 'squared') fx.vignette('rgba(255,245,225,0.55)', 0.35, 0.45);
    R.trailFlash = { t: 0, color: gr.barrel ? 0xffd77a : 0xfff1d0 };
    // graded callout where the ball met the bat
    const sp = R.render.project(p);
    fx.callout({ title: gr.label, value: '0.0', cls: 'c-' + gr.key, x: sp[0], y: Math.max(70, sp[1] - 40), life: 1.9, rise: 34,
      count: { from: 0, to: E.bb.ev, dec: 1, suffix: ' mph', dur: 0.45 },
      sub: gr.foul ? `foul · ${gr.la.toFixed(0)}°` : `${gr.la.toFixed(0)}° · ${Math.round(E.bb.distFt)} ft`, essential: true });
    // crowd builds with the ball's flight
    if (!gr.foul && k > 0.45) Audio.crowd(0.35 + 0.55 * k, Math.min(1.8, 0.25 + E.bb.hangTime * 0.3), 1.6 + 1.6 * k);
  }

  function whiffFX(E) {
    const fx = R.fx;
    const c = Aero.crossY(E.thrown.traj, E.sw.yc);
    const at = E.thrown.plate ? E.thrown.plate.p : [0, U.PLATE_FRONT, 0.8];
    const sp = R.render.project(at);
    if (E.rl.batterUser && c) {
      const dtMs = (E.sw.tClick - (c.t - E.sw.T)) * 1000, dz = (E.sw.aim.z - c.p[2]) / U.IN;
      const timing = Math.abs(dtMs) < 4 ? 'on time' : `${Math.abs(dtMs).toFixed(0)} ms ${dtMs < 0 ? 'early' : 'late'}`;
      const height = Math.abs(dz) < 0.5 ? '' : ` · ${Math.abs(dz).toFixed(1)}″ ${dz > 0 ? 'over' : 'under'}`;
      fx.callout({ title: 'Whiff', cls: 'c-whiff', x: sp[0], y: sp[1] - 30, life: 1.5, rise: 20, sub: timing + height, essential: true });
    } else if (E.rl.pitcherUser) {
      fx.callout({ title: 'Swing & miss', cls: 'c-k', x: sp[0], y: sp[1] - 30, life: 1.5, rise: 20, essential: true });
      fx.vignette('rgba(108,192,139,0.5)', 0.35, 0.4);
    }
  }

  function popFX(E) {
    const fx = R.fx;
    const p = [0, 0, 0];
    Aero.sampleAt(E.thrown.traj, E.tGlove, p);
    const mph = E.measure ? E.measure.plateMph : 85;
    Audio.pop(mph);
    R.gloveKick = { t: 0 };
    const k = U.clamp((mph - 70) / 25, 0, 1);
    fx.burst(p, { count: 8 + Math.round(10 * k), speed: 1 + 1.4 * k, life: 0.45, size: 0.05, color: 0xcdb79a, additive: false, gravity: 1.5, drag: 3, grow: 1.4, opacity: 0.55 });
    fx.flash(p, { screen: 0.03 + 0.03 * k, life: 0.1, opacity: 0.7 });
    if (R.render.camName === 'catcher') fx.shake(0.006 + 0.01 * k, 0.12, 0.006);
  }

  function homeRunFX(E) {
    const fx = R.fx;
    const p = [0, 0, 0];
    Aero.sampleAt(E.bb.traj, R.t, p);
    fx.burst(p, { count: 46, speed: 9, life: 1.3, size: 0.6, color: 0xffd77a, gravity: 4, drag: 1.2 });
    fx.ring(p, { screen: 0.03, to: 0.35, color: 0xffd77a, life: 0.6 });
    fx.vignette('rgba(255,200,110,0.75)', 0.55, 1.0);
    fx.callout({ title: 'Home run', value: '0', cls: 'c-hr', x: R.render.width / 2, y: R.render.height * 0.34, life: 2.6, rise: 16, count: { from: 0, to: E.bb.distFt, dec: 0, suffix: ' ft', dur: 0.9 }, essential: true });
    Audio.crowd(1, 0.15, 4.5);
  }

  // feedback for pitchers: bullseyes and painted corners
  function locationFX(E, oc) {
    if (!E.rl.pitcherUser || !E.thrown.plate) return;
    const fx = R.fx;
    const pp = E.thrown.plate.p;
    const sp = R.render.project(pp);
    const miss = Math.hypot(pp[0] / U.IN - E.target.x, (pp[2] / U.FT - E.target.z) * 12);
    if (E.mode === 'bullpen') {
      if (miss <= 1.5) { fx.callout({ title: 'Bullseye', cls: 'c-perfect', x: sp[0], y: sp[1] - 26, life: 1.4, rise: 22, sub: `${miss.toFixed(1)}″ from target`, essential: true }); fx.ring(pp, { screen: 0.01, to: 0.1, color: 0xffd77a, life: 0.4 }); }
      else if (miss <= 4) fx.callout({ title: 'On target', cls: 'c-clean', x: sp[0], y: sp[1] - 26, life: 1.2, rise: 18, sub: `${miss.toFixed(1)}″ from target`, essential: true });
      return;
    }
    if (oc.kind === 'called') {
      const z = E.zone, R0 = App.ctx().R;
      const ex = U.PLATE_HALF + R0 - Math.abs(pp[0]);
      const ez = Math.min(pp[2] - (z.bot - R0), (z.top + R0) - pp[2]);
      if (Math.min(ex, ez) < 1.5 * U.IN) { fx.callout({ title: 'Painted', cls: 'c-perfect', x: sp[0], y: sp[1] - 26, life: 1.4, rise: 22, sub: 'on the black', essential: true }); fx.ring(pp, { screen: 0.01, to: 0.1, color: 0xffd77a, life: 0.4 }); }
    }
  }

  // ---------------------------------------------------------------- outcomes
  function pitchLabel(E) {
    const m = E.measure;
    return `${E.thrown.releaseMph.toFixed(1)} mph ${E.pitch.name} · ${Math.round(E.thrown.rpm).toLocaleString()} rpm${m ? ` · ${U.fmtSigned(m.ivb, 1)}″ IVB · ${U.fmtSigned(m.hbArm, 1)}″ HB` : ''}`;
  }
  function hitLabel(E) {
    const b = E.bb;
    return `${b.ev.toFixed(1)} mph · ${b.la.toFixed(0)}° · ${Math.round(b.distFt)} ft${E.hit.broke ? ' · bat broken' : ''}`;
  }
  function decideOutcome(E) {
    const ctx = App.ctx();
    if (E.play) {
      if (E.play.kind === 'FOUL') return { kind: 'foul' };
      return { kind: 'inplay' };
    }
    if (E.sw && E.sw.tClick < E.plateT + 0.03) return { kind: 'swstr' };
    if (E.batter && Batting.batterHit(E.thrown.traj, E.batter.hand, E.batter.heightIn, ctx.R)) {
      const zc = Pitching.zoneCheck(E.thrown.traj, E.zone, ctx.R);
      if (!zc.strike) return { kind: 'hbp' };
    }
    return { kind: Pitching.zoneCheck(E.thrown.traj, E.zone, ctx.R).strike ? 'called' : 'ball' };
  }

  function finishEpisode() {
    const E = R.E, S = App.S;
    const oc = decideOutcome(E);
    E.outcome = oc;
    locationFX(E, oc);
    let title = '', hot = false;
    const sub = E.hit ? hitLabel(E) + '  ·  ' + pitchLabel(E) : pitchLabel(E);
    if (E.mode === 'bullpen') {
      title = oc.kind === 'called' ? 'Strike' : oc.kind === 'ball' ? 'Ball' : oc.kind === 'hbp' ? 'Hit by pitch' : 'Strike';
      const miss = E.thrown.plate ? Math.hypot((E.thrown.plate.p[0] / U.IN) - E.target.x, (E.thrown.plate.p[2] / U.FT - E.target.z) * 12) : 0;
      showBanner(title, `${sub}  ·  ${miss.toFixed(1)}″ from target`, false);
    } else {
      const res = applyCount(E, oc);
      title = res.title; hot = res.hot;
      showBanner(title, sub, hot);
    }
    showTele(E);
    R.last = E;
    if (E.mode === 'bullpen' && E.rl.pitcherUser) addToTunnel(E);
    R.phase = 'result'; R.resultT = 0;
    R.dirty = true;
  }

  // shared count logic for cage & game
  function applyCount(E, oc) {
    const S = App.S, inGame = E.mode === 'game';
    const st = inGame ? App.game : App.cage;
    const c = st.count;
    let paEnd = null, title = '', hot = false;
    if (E.mode === 'cage') { if (E.sw) { App.cage.swings++; if (E.hit) App.cage.contacts++; } }
    if (inGame) { App.game.pitchCount++; if (E.thrown.plate) App.game.abPitches.push({ x: E.thrown.plate.p[0] / U.IN, z: E.thrown.plate.p[2] / U.FT, color: Pitching.PITCH_TYPES[E.pitch.type].color, n: App.game.abPitches.length + 1 }); }
    switch (oc.kind) {
      case 'ball': c.b++; title = 'Ball'; if (c.b >= 4) { paEnd = 'BB'; title = 'Ball four'; } break;
      case 'called': c.s++; title = 'Called strike'; if (c.s >= 3) { paEnd = 'K'; title = 'Strike three'; hot = true; } break;
      case 'swstr': c.s++; title = 'Swinging strike'; if (c.s >= 3) { paEnd = 'K'; title = 'Strikeout'; hot = true; } break;
      case 'foul': if (c.s < 2) c.s++; title = 'Foul ball'; break;
      case 'hbp': paEnd = 'HBP'; title = 'Hit by pitch'; break;
      case 'inplay': paEnd = 'BIP'; title = E.play.desc; hot = E.play.kind === 'HR'; break;
    }
    if (E.mode === 'cage') {
      if (E.bb && E.play.kind !== 'FOUL') {
        const b = E.bb;
        const barrel = b.ev >= 98 && b.la >= 26 - (b.ev - 98) && b.la <= 30 + (b.ev - 98) * 1.2;
        App.cage.balls.push({ x: b.landP[0], y: b.landP[1], ev: b.ev, la: b.la, dist: b.distFt, hr: E.play.kind === 'HR', res: E.play.desc, barrel });
        App.cage.log.push(`<span class="t">${b.ev.toFixed(1)}</span><span><b>${E.play.desc}</b> · ${b.la.toFixed(0)}° · ${Math.round(b.distFt)} ft vs ${E.pitch.type}</span>`);
        if (E.play.kind === 'HR') { Audio.crowd(0.9); }
      } else if (oc.kind === 'swstr') App.cage.log.push(`<span class="t">—</span><span>Whiff on ${E.thrown.releaseMph.toFixed(0)} mph ${E.pitch.name}</span>`);
      if (paEnd) { App.cage.pa++; App.cage.count = { b: 0, s: 0 }; }
      App.emit('cage');
      return { title, hot };
    }
    // ---- game
    const g = App.game;
    const who = g.half === 'top' ? `${E.batter.name}` : 'You';
    const runsBefore = (g.half === 'top' ? g.score.away : g.score.home);
    const addRuns = (n) => { const arr = g.half === 'top' ? g.score.away : g.score.home; arr[g.inning - 1] = (arr[g.inning - 1] || 0) + n; };
    if (paEnd) {
      let line = '';
      if (paEnd === 'BB' || paEnd === 'HBP') {
        const fa = Fielding.forceAdvance(g.bases); g.bases = fa.bases; addRuns(fa.runs);
        line = `${who} ${paEnd === 'BB' ? 'walks' : 'is hit by a pitch'}${fa.runs ? ', a run scores' : ''}.`;
      } else if (paEnd === 'K') { g.outs++; line = `${who} strikes out ${oc.kind === 'called' ? 'looking' : 'swinging'}.`; }
      else {
        const p = E.play;
        g.outs += p.outs;
        if (g.outs < 3 || p.kind !== 'OUT') addRuns(p.runs);
        if (g.outs < 3) g.bases = p.bases.map((x) => (x ? 1 : 0));
        line = `${who}: <b>${p.desc}</b> (${E.bb.ev.toFixed(0)} mph, ${E.bb.la.toFixed(0)}°)${p.runs && g.outs < 3 ? `, ${p.runs} run${p.runs > 1 ? 's' : ''} score${p.runs > 1 ? '' : 's'}` : ''}.`;
        if (p.kind === 'HR') Audio.crowd(1);
      }
      logGame(line);
      g.count = { b: 0, s: 0 }; g.abPitches = [];
      if (g.half === 'top') g.cpuIdx = (g.cpuIdx + 1) % 9; else g.userPA++;
      checkHalf();
    }
    App.emit('game');
    return { title, hot };
  }

  function totals() { const g = App.game; const s = (a) => a.reduce((x, y) => x + (y || 0), 0); return { away: s(g.score.away), home: s(g.score.home) }; }
  function checkHalf() {
    const g = App.game, N = App.S.game.innings;
    const t = totals();
    // walk-off
    if (g.half === 'bottom' && g.inning >= N && t.home > t.away) { gameOver('Walk-off! You win.'); return; }
    if (g.outs < 3) return;
    g.bases = [0, 0, 0]; g.outs = 0;
    if (g.half === 'top') {
      if (g.inning >= N && t.home > t.away) { gameOver('You win.'); return; }
      g.half = 'bottom'; g.score.home[g.inning - 1] = g.score.home[g.inning - 1] || 0;
      logGame(`<b>Bottom ${g.inning}.</b> You're up against ${g.arch.name}.`);
      App.setCamera(App.S.cam.gameBat, false);
    } else {
      if (g.inning >= N && t.home !== t.away) { gameOver(t.home > t.away ? 'You win.' : 'CPU wins.'); return; }
      if (g.inning >= N + 3) { gameOver('Called for a tie after ' + g.inning + ' innings.'); return; }
      g.inning++; g.half = 'top'; g.score.away[g.inning - 1] = 0;
      logGame(`<b>Top ${g.inning}.</b> Back on the mound.`);
      App.setCamera(App.S.cam.gamePitch, false);
    }
  }
  function gameOver(msg) {
    const g = App.game, t = totals();

    setTimeout(() => showBanner('Final', `CPU ${t.away} · You ${t.home} — ${msg}`, t.home > t.away), 1900);
    App.emit('game');
  }

  function renderPrompt() {

    else if (rl.pitcherUser && R.phase === 'ready') txt = `Click the zone to aim · <kbd>1</kbd>–<kbd>${Math.min(6, S.arsenal.length)}</kbd> pitch · <kbd>Space</kbd> throw ${S.arsenal[S.sel].name}`;

  // ---------------------------------------------------------------- update loop
  function update(dtReal) {
    const S = App.S;
    let dt = dtReal * S.simSpeed;
    // hit-stop & slow motion: presentation time only (outcomes were decided at the swing)
    if (R.freeze > 0) { R.freeze -= dtReal; dt = 0; }
    else if (R.slow) {
      R.slow.t += dtReal;
      const k = R.slow.t / R.slow.dur;
      if (k >= 1) R.slow = null; else dt *= R.slow.min + (1 - R.slow.min) * k * k;
    }
    R.presDt = dt;
    if (R.group) { R.presDt = dtReal * R.group.speed; updateGroup(dtReal); return; }
    if (R.replay) {
      const rp = R.replay, E = rp.E;
      const slow = E.hit ? (rp.t < E.hit.t + 0.25 ? rp.speed : 1) : rp.speed;
      rp.t += dtReal * slow;
      R.presDt = dtReal * slow;
      if (E.hit && !rp.cracked && rp.t >= E.hit.t) { rp.cracked = true; contactFX(E, true); }
      const sp = document.getElementById('replay-speed');
      if (sp) sp.textContent = slow < 1 ? (slow * 100).toFixed(0) + '% speed' : 'real time';
      const end = E.hit ? E.playEnd : E.tGlove + 0.5;
      if (rp.t > end) R.replay = null;
      return;
    }
    const rl = roles();
    if (R.phase === 'ready') {
      R.readyT += dtReal;
      if (!rl.pitcherUser && (S.mode === 'cage' || (S.mode === 'game' && App.game && App.game.on)) && R.readyT > 1.1 && !UI.anyDrawerOpen()) {
        R.E = newEpisode();
        R.E.windup = 1.45; R.t = -1.45; R.phase = 'windup'; R.lastLoc = null; R.ringAtClick = null;
        clearHud();
      }
    } else if (R.phase === 'meter') {
      const m = R.meter;
      m.t += dtReal;
      const tri = (x) => { const f = x - Math.floor(x); return f < 0.5 ? 2 * f : 2 - 2 * f; };
      const push = (arr, v) => { arr.push(v); if (arr.length > 7) arr.shift(); };
      if (m.stage === 1) { m.slotNeedle = 95 * tri(m.t / 1.6); push(m.trail0, m.slotNeedle); }
      else if (m.stage === 2) { m.pressure = tri(m.t / 1.3); push(m.trail1, m.pressure); }
      else if (m.stage === 3) { m.releasePos = m.t / 0.6; push(m.trail2, m.releasePos); if (m.releasePos >= 1.15) { m.releaseLocked = 1.15; finishMeter(); } }
    } else if (R.phase === 'windup') {
      R.t += dt;
      if (R.t >= 0) { const over = R.t; release(); R.t = over; }
    } else if (R.phase === 'flight') {
      R.t += dt;
      const E = R.E;
      if (E.hit && !R.cracked && R.t >= E.hit.t) {
        R.cracked = true;
        R.t = E.hit.t;
        contactFX(E, false);
        if (E.hit.broke) R.render.spawnBarrel(Batting.pose(E.sw, E.hit.t).ss, U.add(U.scale(E.sw.uhat, E.sw.Vss * 0.6), [0, 0, 4]), [0, 0, 0]);
        // hold the hitter's view through the impact beat, then follow the ball
        R.followAt = S.autoCam && E.play && E.play.kind !== 'FOUL' ? E.hit.t + 0.2 : null;
        R.phase = 'play';
      }
      if (E.sw && !E.hit && !R.whiffed && R.t >= E.plateT + 0.02) { R.whiffed = true; whiffFX(E); }
      if (!E.hit && !R.popped && R.t >= E.tGlove) { R.popped = true; popFX(E); }
      if (!E.hit && R.t > E.tGlove + 0.35) finishEpisode();
    } else if (R.phase === 'play') {
      R.t += dt;
      const E = R.E;
      if (R.followAt != null && R.t >= R.followAt) { R.followAt = null; R.render.setCamera('follow'); }
      if (E.bb && E.bb.hr && !R.overWall && E.bb.overT && R.t >= E.bb.overT) { R.overWall = true; homeRunFX(E); }
      if (R.t > R.E.playEnd) finishEpisode();
    } else if (R.phase === 'result') {
      R.resultT += dtReal;
      if (R.meter && R.meter.stage === 4) R.meter.doneT = (R.meter.doneT || 0) + dtReal;
      if (R.resultT > 1.9) {
        R.phase = 'ready'; R.readyT = 0; R.meter = null;
        R.render.clearPieces();
        R.render.setCamera(S.cam[camKey()]);
        if (S.mode === 'game' && App.game && App.game.on) App.emit('game');
      }
    }
  }

  // ---------------------------------------------------------------- scene drawing
  const STANCE = (hand) => { const sh = hand === 'L' ? -1 : 1; return { knob: [-sh * 0.6, 0.12, 1.22], dir: U.norm([-sh * 0.25, -0.5, 0.83]) }; };
  function batPose(sw, t, hand) {
    const st = STANCE(hand);
    if (!sw) return { knob: st.knob, dir: st.dir, frac: 0 };
    const tau = t - sw.tClick;
    if (tau <= 0) return { knob: st.knob, dir: st.dir, frac: 0 };
    const ps = Batting.pose(sw, t);
    const b = U.smoothstep(0, 0.5, tau / sw.T);
    const knob = U.lerpV(st.knob, ps.knob, b);
    const dir = U.norm(U.lerpV(st.dir, ps.d, b));
    return { knob, dir, frac: U.clamp(tau / (sw.T * 1.15), 0, 1.2) };
  }
  const _p = [0, 0, 0], _v = [0, 0, 0];

  function drawScene(dtReal) {
    const S = App.S, rnd = R.render;
    if (R.group) { drawGroup(); rnd.stepPieces(dtReal); return; }
    const rp = R.replay;
    const E = rp ? rp.E : R.E;
    const t = rp ? rp.t : R.t;
    const phase = rp ? (E.hit && t >= E.hit.t ? 'play' : t >= 0 ? 'flight' : 'windup') : R.phase;
    const rl = E ? E.rl : roles();
    const userFielding = S.mode === 'bullpen' || (S.mode === 'game' && App.game && App.game.half === 'top');
    const fieldTeam = userFielding ? Rn.COLORS.home : Rn.COLORS.away;
    const batTeam = userFielding ? Rn.COLORS.away : Rn.COLORS.home;
    // ---- pitcher
    const pitcher = E ? E.pitcher : (rl.pitcherUser ? S.pitcher : (S.mode === 'cage' ? App.cageArch().pitcher : App.game && App.game.arch ? App.game.arch.pitcher : S.pitcher));
    const pitch = E ? E.pitch : S.arsenal[S.sel];
    const relFt = Pitching.releasePointFt(pitcher, pitcher.armSlot, pitch.ext);
    let rel = [relFt.x * U.FT * (pitcher.hand === 'L' ? -1 : 1), relFt.y * U.FT, relFt.z * U.FT];
    if (E && E.thrown) rel = [E.thrown.traj.P[0], E.thrown.traj.P[1], E.thrown.traj.P[2]];
    let u = 0, v = 0;
    if (phase === 'windup' && E) u = U.clamp((t + E.windup) / E.windup, 0, 1);
    else if (!rp && R.phase === 'meter' && R.meter) { const m = R.meter; u = m.stage === 1 ? 0.04 + 0.16 * Math.min(1, m.t / 1.6) : m.stage === 2 ? 0.2 + 0.25 * Math.min(1, m.t / 1.3) : 0.45 + 0.55 * Math.min(1, (m.releasePos || 0) / m.releaseWindow); }
    else if (phase === 'flight' || phase === 'play' || (phase === 'result' && E)) { u = 1; v = Math.max(0, t); }
    Rn.setTeam(rnd.figs.pitcher, fieldTeam); rnd.figs.pitcher.gloveHand = pitcher.hand === 'L' ? 'r' : 'l';
    Rn.poseFigure(rnd.figs.pitcher, Rn.Pose.pitcher({ h: (pitcher.heightIn / 12) * U.FT, hand: pitcher.hand, release: rel, u, v }));
    // ---- catcher & ump
    Rn.setTeam(rnd.figs.catcher, fieldTeam);
    const cJ = Rn.Pose.stand({ x: 0, y: -0.92, face: 0, h: 1.8, crouch: 1 });
    let glove = [-0.05, -0.62, 0.85];
    if (E && E.thrown && E.thrown.plate) {
      const tgt = [E.thrown.plate.p[0], -0.62, Math.max(0.25, E.thrown.plate.p[2] - 0.04)];
      const k = phase === 'windup' ? 0 : U.smoothstep(0.05, Math.max(0.1, E.plateT * 0.85), Math.max(0, t));
      const start = E.target ? [E.target.x * U.IN, -0.62, E.target.z * U.FT] : glove;
      glove = U.lerpV(start, tgt, k);
    } else if (E && E.target) glove = [E.target.x * U.IN, -0.62, E.target.z * U.FT];
    else if (rl.pitcherUser) { const tg = S.arsenal[S.sel].target; glove = [tg.x * U.IN, -0.62, tg.z * U.FT]; }
    if (R.gloveKick) {
      R.gloveKick.t += dtReal;
      const k = Math.max(0, 1 - R.gloveKick.t / 0.16);
      glove = [glove[0], glove[1] - 0.07 * k * k, glove[2]];
      if (k <= 0) R.gloveKick = null;
    }
    cJ.lHand = glove;
    cJ.lElbow = U.lerpV(cJ.lSh, glove, 0.5);
    const hitHappened = E && E.hit && t >= E.hit.t;
    if (hitHappened) { const sj = Rn.Pose.stand({ x: 0, y: -0.92, face: 0, h: 1.8, crouch: 0.2 }); Rn.poseFigure(rnd.figs.catcher, sj); } else Rn.poseFigure(rnd.figs.catcher, cJ);
    Rn.poseFigure(rnd.figs.ump, Rn.Pose.stand({ x: 0.2, y: -1.75, face: 0, h: 1.83, crouch: 0.45 }));
    // ---- batter & bat
    const batter = E ? E.batter : rl.batter;
    if (batter) {
      Rn.setTeam(rnd.figs.batter, batTeam);
      const sw = E ? E.sw : null;
      const bp = batPose(sw, t, batter.hand);
      if (hitHappened && t > E.hit.t + 0.45 && E.play && E.play.kind !== 'FOUL') { rnd.figs.batter.g.visible = false; rnd.placeBat(bp.knob, bp.dir, false); }
      else {
        Rn.poseFigure(rnd.figs.batter, Rn.Pose.batter({ h: (batter.heightIn / 12) * U.FT, hand: batter.hand, knob: bp.knob, dir: bp.dir, frac: bp.frac, stride: sw ? 1 : 0.4 }));
        if (E && E.swBat && rnd.batL !== E.swBat.L) rnd.setBat(E.swBat);
        else if (!E && rnd.batL !== App.bat().L) rnd.setBat(App.bat());
        const broke = E && E.hit && E.hit.broke && t >= E.hit.t;
        rnd.placeBat(bp.knob, bp.dir, true);
        if (broke) rnd.batMesh.scale.set(1, 0.42, 1); else rnd.batMesh.scale.set(1, 1, 1);
      }
    } else { rnd.figs.batter.g.visible = false; rnd.placeBat(null, null, false); }
    // ---- fielders
    const play = E && E.play && hitHappened ? E.play : null;
    for (const f of Fielding.FIELDERS) {
      const fig = rnd.fielders[f.pos];
      if (!fig) continue;
      Rn.setTeam(fig, fieldTeam);
      const show = S.mode !== 'bullpen';
      if (!show) { fig.g.visible = false; continue; }
      let x = f.x, y = f.y, face = Math.atan2(-f.x, -f.y), run = 0, ph = 0;
      if (play) {
        const m = play.movers.find((q) => q.pos === f.pos);
        if (m && m.t1 > m.t0) {
          const k = U.clamp((t - m.t0) / (m.t1 - m.t0), 0, 1);
          x = U.lerp(m.from[0], m.to[0], k); y = U.lerp(m.from[1], m.to[1], k);
          if (k > 0 && k < 1) { run = 1; ph = t * 11; face = Math.atan2(m.to[0] - m.from[0], m.to[1] - m.from[1]); }
        }
      }
      Rn.poseFigure(fig, Rn.Pose.stand({ x, y, face, h: 1.85, crouch: play ? 0.1 : 0.3, run, phase: ph }));
    }
    // ---- runners
    const runners = rnd.runners;
    runners.forEach((r) => Rn.setTeam(r, batTeam));
    const basePos = [[0, 0], Batted.BASES.first, Batted.BASES.second, Batted.BASES.third, [0, 0]];
    const along = (from, to, k) => {
      const segs = to - from;
      if (segs <= 0) return basePos[from];
      const x = k * segs, i = Math.min(segs - 1, Math.floor(x)), f = x - i;
      const a = basePos[from + i], b = basePos[from + i + 1];
      return [U.lerp(a[0], b[0], f), U.lerp(a[1], b[1], f)];
    };
    let ri = 0;
    if (S.mode === 'game' && App.game) {
      if (play && play.runners.length) {
        for (const r of play.runners) {
          if (ri >= 4) break;
          const k = U.clamp((t - r.t0) / Math.max(0.1, r.t1 - r.t0), 0, 1);
          if (r.out && r.outT && t > r.outT + 0.6) continue;
          if (r.to === 4 && k >= 1) continue;
          const p = along(r.from, r.to, k);
          const nxt = along(r.from, r.to, Math.min(1, k + 0.05));
          Rn.poseFigure(runners[ri++], Rn.Pose.stand({ x: p[0], y: p[1], face: Math.atan2(nxt[0] - p[0], nxt[1] - p[1]), h: 1.83, run: k > 0 && k < 1 ? 1 : 0, phase: t * 12 }));
        }
      } else {
        App.game.bases.forEach((on, i) => {
          if (!on || ri >= 4) return;
          const b = basePos[i + 1], n = basePos[i + 2];
          const lead = 2.5, d = U.norm([n[0] - b[0], n[1] - b[1], 0]);
          Rn.poseFigure(runners[ri++], Rn.Pose.stand({ x: b[0] + d[0] * lead, y: b[1] + d[1] * lead, face: Math.atan2(-b[0], -b[1]), h: 1.83, crouch: 0.35 }));
        });
      }
    }
    for (; ri < 4; ri++) runners[ri].g.visible = false;

    // ---- ball
    let ballP = null, Rm = null, glow = S.glow ? 0.42 : 0;
    if (E && (phase === 'windup' || (!rp && R.phase === 'meter'))) {
      ballP = null; // in the hand (hidden for clarity; the hand carries it)
    } else if (E && E.thrown) {
      if (E.hit && t >= E.hit.t) {
        const tr = E.bb.traj;
        const p = E.play;
        if (p && p.catchT && t >= p.catchT) {
          ballP = p.catchP.slice(); ballP[2] = Math.max(ballP[2], 0.9);
          for (const th of p.throws) {
            if (t >= th.t0 && t <= th.t1) { const k = (t - th.t0) / (th.t1 - th.t0); ballP = U.lerpV(th.from, th.to, k); ballP[2] += Math.sin(Math.PI * k) * Math.min(4, U.dist(th.from, th.to) * 0.06); }
            else if (t > th.t1) ballP = th.to.slice();
          }
        } else { Aero.sampleAt(tr, t, _p, _v); ballP = _p.slice(); }
        const w = E.hit.wOut, wr = U.len(w);
        Rm = wr > 0 ? U.m3mul(U.m3rot(U.scale(w, 1 / wr), wr * (t - E.hit.t)), Pitching.orientationAt(E.thrown, E.hit.t)) : null;
        rnd.follow(ballP);
      } else {
        const tt = Math.min(t, E.tGlove);
        Aero.sampleAt(E.thrown.traj, tt, _p, _v);
        ballP = _p.slice();
        Rm = Pitching.orientationAt(E.thrown, tt);
      }
    }
    rnd.placeBall(ballP || [0, 0, -5], Rm, !!ballP, glow);
    rnd.stepPieces(dtReal);
    drawSwingTrail(E, t);
    drawBatting(E, t, phase);
    drawComet(E, t, phase);

    // ---- lines, markers, zone
    if (R.dirty || rp || phase === 'flight' || phase === 'play') drawLines(E, t, phase, rl);
    R.dirty = false;
  }

  // motion trail behind the barrel, sampled from the swing's own kinematics
  function drawSwingTrail(E, t) {
    const fx = R.fx;
    const sw = E && E.sw;
    if (!sw || !E.batter || (E.hit && t > E.hit.t + 0.45 && E.play && E.play.kind !== 'FOUL')) { fx.setRibbon(null); return; }
    const tau = t - sw.tClick;
    if (tau < sw.T * 0.35 || tau > sw.T + 0.2) { fx.setRibbon(null); return; }
    const L = E.swBat.L, samples = [];
    for (let k = 0; k < 16; k++) {
      const tk = t - k * 0.0065;
      if (tk - sw.tClick < sw.T * 0.3) break;
      const ps = Batting.pose(sw, tk);
      samples.push({ a: U.add(ps.knob, U.scale(ps.d, 0.42 * L)), b: U.add(ps.knob, U.scale(ps.d, L)) });
    }
    let color = 0xece6d6;
    if (R.trailFlash) { R.trailFlash.t += R.presDt || 0.016; if (R.trailFlash.t < 0.25) color = R.trailFlash.color; else R.trailFlash = null; }
    fx.setRibbon(samples, color);
  }
  // glowing comet behind a batted ball (and behind a perfectly delivered pitch)
  function drawComet(E, t, phase) {
    const fx = R.fx;
    if (!E || !E.thrown || !(phase === 'flight' || phase === 'play' || phase === 'result')) { fx.setComet(null); return; }
    const pts = [], p = [0, 0, 0];
    if (E.hit && t >= E.hit.t) {
      const tEnd = E.play && E.play.catchT ? E.play.catchT : (E.bb.landed ? E.bb.landed.t + 0.6 : Infinity);
      if (t > tEnd) { fx.setComet(null); return; }
      for (let k = 0; k < 14; k++) { const tk = t - k * 0.022; if (tk < E.hit.t) break; Aero.sampleAt(E.bb.traj, tk, p); pts.push(p.slice()); }
      const ev = E.bb.ev, k = E.grade ? E.grade.k : 0.5;
      fx.setComet(pts, ev >= 105 ? 0xffc35e : ev >= 95 ? 0xffd9a0 : 0xe8e2d0, k);
    } else if (E.delivery && E.delivery.perfect === 3 && t <= E.tGlove) {
      for (let k = 0; k < 10; k++) { const tk = t - k * 0.008; if (tk < 0) break; Aero.sampleAt(E.thrown.traj, tk, p); pts.push(p.slice()); }
      fx.setComet(pts, 0xffd77a, 0.25);
    } else fx.setComet(null);
  }

  // ---------------------------------------------------------------- batting HUD
  // Barrel ghost at the planned contact pose, pitch locator + swing-timing ring, crossing marker.
  const HIT_AIDS = { rookie: 'Rookie', pro: 'Pro', real: 'Real' };
  function plannedPose(aim) {
    const S = App.S, bat = App.bat();
    const sw = Batting.makeSwing({ hand: S.batter.hand, aim, attackDeg: S.swing.attack, tClick: 0, type: S.swing.type }, S.batter, bat);
    return { knob: U.sub(sw.A, U.scale(sw.dstar, bat.sNode)), dir: sw.dstar, yc: sw.yc };
  }
  // Where is the ball heading? Pro: gravity + drag only (you must read the spin break yourself).
  // Rookie: the ball's current total acceleration, so the break is included.
  function locate(E, t, aimX) {
    const S = App.S, ctx = App.ctx(), tr = E.thrown.traj;
    const p = [0, 0, 0], v = [0, 0, 0];
    Aero.sampleAt(tr, t, p, v);
    const yc = Batting.contactDepth(S.batter.hand, aimX);
    if (p[1] <= yc) return null;
    let acc = null;
    if (S.hitAids === 'rookie') {
      const va = [0, 0, 0], vb = [0, 0, 0], q = [0, 0, 0], t0 = Math.max(0, t - 0.006);
      Aero.sampleAt(tr, t0, q, va); Aero.sampleAt(tr, t0 + 0.012, q, vb);
      acc = U.scale(U.sub(vb, va), 1 / 0.012);
    }
    const kd = ctx.kq * 0.33, h = 0.002;
    let q = p.slice(), w = v.slice(), tt = t;
    for (let k = 0; k < 500 && q[1] > yc; k++) {
      let a = acc;
      if (!a) { const sp = U.len(w); a = [-kd * sp * w[0], -kd * sp * w[1], -ctx.g - kd * sp * w[2]]; }
      const wn = U.madd(w, a, h), qn = U.madd(q, w, h);
      if (qn[1] <= yc) { const f = (q[1] - yc) / (q[1] - qn[1]); q = U.lerpV(q, qn, f); tt += h * f; break; }
      w = wn; q = qn; tt += h;
    }
    return { p: [q[0], yc, q[2]], t: tt };
  }
  function drawBatting(E, t, phase) {
    const S = App.S, rnd = R.render, rl = E ? E.rl : roles();
    const cv = R.hud;
    const W2 = rnd.width, H2 = rnd.height, dpr = Math.min(2, G.devicePixelRatio || 1);
    if (cv.width !== Math.round(W2 * dpr) || cv.height !== Math.round(H2 * dpr)) { cv.width = Math.round(W2 * dpr); cv.height = Math.round(H2 * dpr); }
    const g = cv.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, W2, H2);
    if (!rl.batterUser || R.replay || (S.mode === 'game' && !(App.game && App.game.on))) { rnd.setBatGhost(null); return; }
    // barrel ghost: where the bat will be at contact
    const hitDone = E && E.hit && t >= E.hit.t;
    const passed = E && E.thrown && t > E.plateT + 0.08;
    if (hitDone || passed && E.sw) rnd.setBatGhost(null);
    else if (E && E.sw) rnd.setBatGhost({ knob: U.sub(E.sw.A, U.scale(E.sw.dstar, E.swBat.sNode)), dir: E.sw.dstar }, 'locked');
    else rnd.setBatGhost(plannedPose(R.aim), 'aim');
    // crossing marker: where the pitch actually went through your contact plane
    if (E && E.thrown && !E.hit) {
      if (!E.cross) { const c = Aero.crossY(E.thrown.traj, Batting.contactDepth(S.batter.hand, R.aim.x)); if (c) E.cross = { p: c.p, t: c.t }; }
      if (E.cross && t >= E.cross.t) {
        const sp = rnd.project(E.cross.p);
        const col = Pitching.PITCH_TYPES[E.pitch.type].color;
        g.strokeStyle = col; g.lineWidth = 2.5;
        g.beginPath(); g.arc(sp[0], sp[1], 9, 0, Math.PI * 2); g.stroke();
        g.fillStyle = col; g.beginPath(); g.arc(sp[0], sp[1], 3, 0, Math.PI * 2); g.fill();
        g.font = '600 10px "JetBrains Mono", ui-monospace, monospace'; g.textAlign = 'left'; g.textBaseline = 'middle';
        g.fillStyle = 'rgba(236,230,214,0.9)'; g.fillText('crossed here', sp[0] + 14, sp[1]);
      }
    }
    if (!E || !E.thrown || phase !== 'flight' || E.hit && t >= E.hit.t) { drawSwingGrade(g, E); return; }
    if (S.hitAids === 'real' || t > E.plateT) { drawSwingGrade(g, E); return; }
    // pitch locator + timing ring
    const loc = locate(E, t, E.sw ? E.sw.aim.x : R.aim.x) || R.lastLoc;
    if (!loc) return;
    R.lastLoc = loc;
    const sp = rnd.project(loc.p);
    const T = E.sw ? E.sw.T : Batting.swingTime(App.bat(), S.swing.type);
    const ideal = loc.t - T;
    let rad, col, lw = 2;
    if (!E.sw) {
      const remain = ideal - t, span = Math.max(0.12, ideal);
      rad = 9 + 118 * U.clamp(remain / span, 0, 1);
      col = remain < 0.035 ? '#ffd77a' : 'rgba(236,230,214,0.85)';
      if (remain < 0.035) lw = 3.5;
      if (remain < -0.012) { col = `rgba(239,106,87,${U.clamp(1 + remain * 8, 0.2, 1)})`; rad = 9 + Math.min(18, -remain * 160); }
      R.ringAtClick = { rad, x: sp[0], y: sp[1] };
    } else { rad = (R.ringAtClick && R.ringAtClick.rad) || 9; col = E.swingGrade ? E.swingGrade.color : '#ece6d6'; lw = 3; }
    g.strokeStyle = col; g.lineWidth = lw;
    g.beginPath(); g.arc(sp[0], sp[1], rad, 0, Math.PI * 2); g.stroke();
    // the ball's true outline on the contact plane, its center, and the lift line ~1″ under center
    const br = Math.max(4, Math.abs(rnd.project(U.add(loc.p, [0, 0, App.ctx().R]))[1] - sp[1]));
    const lift = rnd.project(U.add(loc.p, [0, 0, -1.0 * U.IN]));
    g.fillStyle = 'rgba(236,230,214,0.16)'; g.strokeStyle = 'rgba(236,230,214,0.95)'; g.lineWidth = 1.5;
    g.beginPath(); g.arc(sp[0], sp[1], br, 0, Math.PI * 2); g.fill(); g.stroke();
    g.fillStyle = '#ece6d6'; g.beginPath(); g.arc(sp[0], sp[1], 2, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#ffd77a'; g.lineWidth = 2;
    for (const sx of [-1, 1]) { g.beginPath(); g.moveTo(sp[0] + sx * (br + 3), lift[1]); g.lineTo(sp[0] + sx * (br + 12), lift[1]); g.stroke(); }
    if (!R.liftHintShown || R.liftHintShown > performance.now() - 6000) {
      R.liftHintShown = R.liftHintShown || performance.now();
      g.font = '600 9px "JetBrains Mono", ui-monospace, monospace'; g.fillStyle = 'rgba(255,215,122,0.9)'; g.textAlign = 'left'; g.textBaseline = 'middle';
      g.fillText('lift', sp[0] + br + 15, lift[1]);
    }
    drawSwingGrade(g, E, sp, rad);
  }
  function drawSwingGrade(g, E, at, rad) {
    if (!E || !E.swingGrade || !E.cross) return;
    const sg = E.swingGrade;
    const p = at || R.render.project(E.cross.p);
    const txt = sg.label === 'Perfect' ? 'PERFECT TIMING' : sg.label === 'Good' ? `GOOD  ${sg.ms >= 0 ? '+' : '−'}${Math.abs(sg.ms).toFixed(0)} ms` : `${sg.label.toUpperCase()}  ${Math.abs(sg.ms).toFixed(0)} ms`;
    g.font = '800 18px "Big Shoulders Display", "Arial Narrow", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'bottom';
    const y = p[1] - Math.max(30, (rad || 0) + 10);
    g.lineWidth = 4; g.strokeStyle = 'rgba(12,18,21,0.75)'; g.strokeText(txt, p[0], y);
    g.fillStyle = sg.color; g.fillText(txt, p[0], y);
  }

  let lastLinesKey = '';
  function drawLines(E, t, phase, rl) {
    const S = App.S, rnd = R.render;
    rnd.setZone(E ? E.zone : App.currentZone(), true);
    // trajectories
    const list = [];
    if (S.mode === 'bullpen') {
      const key = 'bp' + _ctxKey + JSON.stringify([S.arsenal, S.pitcher, S.sel, S.showGhosts, S.showAll]) + '|' + R.tunnelVer;
      if (key !== lastLinesKey) {
        lastLinesKey = key;
        R.tunnel.forEach((it, i) => list.push({ P: it.thrown.traj.P, n: it.nEnd, color: it.color, opacity: 0.3 + 0.4 * ((i + 1) / R.tunnel.length), step: 3 }));
        const a = App.analysisFor(S.sel);
        if (S.showAll) S.arsenal.forEach((p, i) => { if (i !== S.sel) { const b = App.analysisFor(i); if (b && b.ok) list.push({ P: b.traj.P, n: b.traj.n, color: Pitching.PITCH_TYPES[p.type].color, opacity: 0.35, step: 4 }); } });
        if (a && a.ok) {
          list.push({ P: a.traj.P, n: a.traj.n, color: Pitching.PITCH_TYPES[S.arsenal[S.sel].type].color, opacity: 0.9, step: 2 });
          if (S.showGhosts) {
            list.push({ P: a.ghostMagnus.P, n: a.ghostMagnus.n, color: 0xece6d6, opacity: 0.55, dash: 0.25, step: 2 });
            list.push({ P: a.ghostNoSpin.P, n: a.ghostNoSpin.n, color: 0x8a9692, opacity: 0.5, dash: 0.08, step: 2 });
          }
        }
        rnd.setTrajectories(list);
      }
    } else if (lastLinesKey !== 'none') { rnd.setTrajectories([]); lastLinesKey = 'none'; }
    // live trail
    if (E && E.thrown && (phase === 'flight' || phase === 'play' || phase === 'result')) {
      const pts = [];
      const col = Pitching.PITCH_TYPES[E.pitch.type].color;
      if (E.hit && t >= E.hit.t) {
        const tr = E.bb.traj;
        const tEnd = E.play && E.play.catchT ? Math.min(t, E.play.catchT) : t;
        for (let i = 0; i < tr.n; i += 8) { if (tr.T[i] > tEnd) break; pts.push([tr.P[i * 3], tr.P[i * 3 + 1], tr.P[i * 3 + 2]]); }
        rnd.setTrail(pts, 0xd08a52);
        rnd.setLanding(E.bb.hr ? null : E.bb.landP && t < (E.bb.landed ? E.bb.landed.t : 0) ? E.bb.landP : null);
      } else {
        const tr = E.thrown.traj;
        const showFull = S.mode === 'bullpen' || R.replay;
        const t0 = showFull ? 0 : Math.max(0, t - 0.12);
        for (let i = 0; i < tr.n; i += 2) { if (tr.T[i] > Math.min(t, E.tGlove)) break; if (tr.T[i] >= t0) pts.push([tr.P[i * 3], tr.P[i * 3 + 1], tr.P[i * 3 + 2]]); }
        rnd.setTrail(pts, col);
        rnd.setLanding(null);
      }
    } else { rnd.setTrail(null); rnd.setLanding(null); }
    // target & aim
    const showTarget = rl.pitcherUser && (R.phase === 'ready' || R.phase === 'meter' || R.phase === 'windup') && !R.replay;
    if (showTarget) { const tg = E && E.target ? E.target : S.arsenal[S.sel].target; rnd.setTarget([tg.x * U.IN, 0, tg.z * U.FT]); } else rnd.setTarget(null);
    rnd.setAim(null);
    // history dots
    let dots = [];
    if (S.mode === 'bullpen') dots = R.tunnel.filter((d) => d.plate).map((d, i, a) => ({ x: d.plate[0], z: d.plate[2], color: d.color, opacity: 0.3 + 0.7 * ((i + 1) / a.length) }));
    else if (S.mode === 'game' && App.game) dots = App.game.abPitches.map((p) => ({ x: p.x * U.IN, z: p.z * U.FT, color: p.color, label: String(p.n) }));
    const dk = JSON.stringify(dots);
    if (dk !== R._dotsKey) { R._dotsKey = dk; rnd.setHistory(dots); }
  }

  // ---------------------------------------------------------------- tunnel set
  // The Bullpen keeps your most recent throws (actual flights) so they can be compared, cleared,
  // and replayed together. Presentation only: nothing here feeds back into the physics.
  const TUNNEL_MAX = 10;
  function addToTunnel(E) {
    const tr = E.thrown.traj;
    R.tunnel.push({
      thrown: E.thrown, type: E.pitch.type, name: E.pitch.name, color: Pitching.PITCH_TYPES[E.pitch.type].color,
      tGlove: E.tGlove, plateT: E.plateT, nEnd: Math.min(tr.n, Math.round(E.tGlove / tr.dt) + 1),
      pitcher: Object.assign({}, E.pitcher), plate: E.thrown.plate ? E.thrown.plate.p.slice() : null,
    });
    if (R.tunnel.length > TUNNEL_MAX) R.tunnel.shift();
    R.tunnelVer++; R.dirty = true;
    App.emit('tunnel');
  }
  App.tunnelInfo = () => ({ items: R.tunnel, max: TUNNEL_MAX, playing: !!R.group });
  App.clearTunnel = () => {
    if (R.group) stopGroup();
    if (!R.tunnel.length) return;
    R.tunnel = []; R.tunnelVer++; R.dirty = true;
    App.emit('tunnel');
    UI.toast('Tunnel set cleared');
  };
  App.replayTunnel = () => {
    if (App.S.mode !== 'bullpen') return;
    if (!R.tunnel.length) { UI.toast('Throw a few pitches first'); return; }
    if (!(R.phase === 'ready' || R.phase === 'result')) return;
    R.replay = null;
    const items = R.tunnel.slice();
    // commit-point frame centered on where the set passes 23.8 ft
    let cx = 0, cz = 0, k = 0;
    for (const it of items) { const c = Aero.crossY(it.thrown.traj, 23.8 * U.FT); if (c) { cx += c.p[0]; cz += c.p[2]; k++; } }
    R.render.setGroup(items.map((it) => ({ traj: it.thrown.traj, nEnd: it.nEnd, color: it.color })), k ? [cx / k, 23.8 * U.FT, cz / k] : null);
    R.render.setTrajectories([]); R.render.setTrail(null); R.render.setTarget(null); R.render.setLanding(null);
    lastLinesKey = 'group';
    R.fx.setRibbon(null); R.fx.setComet(null);
    const end = Math.max(...items.map((it) => it.tGlove)) + 0.9;
    R.group = { items, t: -0.7, speed: R.groupSpeed || 0.3, end, whipped: false, popped: items.map(() => false) };
    clearHud();
    App.emit('tunnel');
  };
  function stopGroup() {
    R.group = null;
    R.render.clearGroup();
    lastLinesKey = ''; R._dotsKey = null; R.dirty = true;
    App.emit('tunnel');
  }
  App.stopTunnelReplay = stopGroup;

  function updateGroup(dtReal) {
    const gp = R.group;
    const before = gp.t;
    gp.t += dtReal * (gp.t < 0 ? 1 : gp.speed);
    if (!gp.whipped && before < 0 && gp.t >= 0) { gp.whipped = true; Audio.whip(gp.items[gp.items.length - 1].thrown.releaseMph); }
    gp.items.forEach((it, i) => { if (!gp.popped[i] && gp.t >= it.tGlove) { gp.popped[i] = true; Audio.pop(it.thrown.plateMph || 85); } });
    if (gp.t > gp.end) stopGroup();
  }
  // every ball released together, each on its own measured path
  function drawGroup() {
    const gp = R.group, rnd = R.render, t = gp.t;
    const newest = gp.items[gp.items.length - 1];
    const tr0 = newest.thrown.traj;
    const pitcher = newest.pitcher;
    const u = U.clamp((t + 0.7) / 0.7, 0, 1), v = Math.max(0, t);
    Rn.setTeam(rnd.figs.pitcher, Rn.COLORS.home); rnd.figs.pitcher.gloveHand = pitcher.hand === 'L' ? 'r' : 'l';
    Rn.poseFigure(rnd.figs.pitcher, Rn.Pose.pitcher({ h: (pitcher.heightIn / 12) * U.FT, hand: pitcher.hand, release: [tr0.P[0], tr0.P[1], tr0.P[2]], u, v }));
    rnd.placeBall([0, 0, -5], null, false, 0);
    const p = [0, 0, 0];
    rnd.placeGroup(gp.items.map((it) => {
      if (t < 0) return { visible: false, t: 0 };
      const tt = Math.min(t, it.tGlove);
      Aero.sampleAt(it.thrown.traj, tt, p);
      return { p: p.slice(), R: Pitching.orientationAt(it.thrown, tt), t: tt, visible: true };
    }));
    // plate dots appear as each ball crosses the front of the plate
    const dots = gp.items.filter((it) => it.plate && t >= it.plateT).map((it) => ({ x: it.plate[0], z: it.plate[2], color: it.color }));
    const dk = JSON.stringify(dots);
    if (dk !== R._dotsKey) { R._dotsKey = dk; rnd.setHistory(dots); }
  }

  // ---------------------------------------------------------------- cameras
  const CAMS = [['catcher', 'Catcher'], ['pitcher', 'Mound'], ['broadcast', 'CF'], ['side', 'Side'], ['overhead', 'Top'], ['field', 'Field']];
  App.setCamera = (name, immediate) => {
    App.S.cam[camKey()] = name;
    App.save();
    R.render.setCamera(name, { immediate });
    document.querySelectorAll('#cams button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.cam === name)));
  };
  // deterministic swing at an exact flight time (used by automated tests)
  App.swingAt = (t) => trySwing(t);
  App.replay = () => {
    if (R.group) stopGroup();
    const E = R.last;
    if (!E || !E.thrown) { UI.toast('Throw or see a pitch first'); return; }
    R.replay = { E, t: -0.25, speed: 0.2 };
    if (E.hit && App.S.autoCam) R.render.setCamera(App.S.cam[camKey()]);
  };

  // ---------------------------------------------------------------- input
  function bindInput() {
    const vp = document.getElementById('viewport');
    const S = App.S;
    const toAim = (ev) => {
      const r = vp.getBoundingClientRect();
      const px = ev.clientX - r.left, py = ev.clientY - r.top;
      let p = R.render.unprojectToY(px, py, U.PLATE_FRONT);
      if (p && roles().batterUser) {
        // hitting: aim on the contact plane, so the sweet spot sits exactly under the cursor
        for (let k = 0; k < 2; k++) { const q = R.render.unprojectToY(px, py, Batting.contactDepth(App.S.batter.hand, p[0])); if (q) p = q; }
      }
      return p;
    };
    vp.addEventListener('pointermove', (ev) => {
      const rl = roles();
      if (rl.batterUser) {
        const p = toAim(ev);
        if (p && !(R.E && R.E.sw && (R.phase === 'flight' || R.phase === 'windup'))) { R.aim = { x: U.clamp(p[0], -0.75, 0.75), z: U.clamp(p[2], 0.15, 1.7) }; R.dirty = true; }
      }
    });
    vp.addEventListener('pointerdown', (ev) => {
      if (ev.target.closest('button, select, input, canvas:not(.gl)')) return;
      Audio.unlock();
      const rl = roles();
      if (rl.batterUser) {
        const p = toAim(ev);
        if (p) R.aim = { x: U.clamp(p[0], -0.75, 0.75), z: U.clamp(p[2], 0.15, 1.7) };
        if (ev.pointerType === 'mouse') trySwing();
        R.dirty = true;
        return;
      }
      if (rl.pitcherUser && R.phase === 'ready') {
        const p = toAim(ev);
        if (!p) return;
        const tx = U.clamp(p[0] / U.IN, -20, 20), tz = U.clamp(p[2] / U.FT, 0.5, 4.5);
        if (Math.abs(p[0]) < 1.2 && p[2] > 0 && p[2] < 1.8) {
          const pt = S.arsenal[S.sel].target; pt.x = +tx.toFixed(1); pt.z = +tz.toFixed(2);
          App.pitchChanged(); UI.refreshAll();
        }
      } else if (rl.pitcherUser && R.phase === 'meter') advanceMeter();
    });
    vp.addEventListener('wheel', (ev) => {
      if (!roles().batterUser) return;
      ev.preventDefault();
      S.swing.attack = U.clamp(S.swing.attack + (ev.deltaY < 0 ? 1 : -1), -10, 30); App.save(); UI.refreshAll();
    }, { passive: false });
    G.addEventListener('keydown', (ev) => {
      if (ev.target.closest && ev.target.closest('input, select, textarea')) return;
      const k = ev.key.toLowerCase();
      const rl = roles();
      if (k === 'escape') { UI.closeDrawers(); R.replay = null; if (R.group) stopGroup(); return; }
      if (UI.anyDrawerOpen()) return;
      if (k === ' ') { ev.preventDefault(); App.primaryAction(); return; }
      if (k === 'c') { const i = CAMS.findIndex((c) => c[0] === S.cam[camKey()]); App.setCamera(CAMS[(i + 1) % CAMS.length][0]); return; }
      if (k === 'r') { if (R.group) stopGroup(); App.replay(); return; }
      if (k === 't' && S.mode === 'bullpen') { if (R.group) stopGroup(); else App.replayTunnel(); return; }
      if (k === 'x' && S.mode === 'bullpen') { App.clearTunnel(); return; }
      if (k === 'e') { UI.openDrawer('drawer-env'); return; }
      if (k === 'p') { UI.openDrawer('drawer-phys'); return; }
      if (k === 'h' || k === '?') { UI.openDrawer('drawer-help'); return; }
      if (rl.batterUser) {
        if (k === 'w' || k === 'arrowup') { ev.preventDefault(); S.swing.attack = U.clamp(S.swing.attack + 1, -10, 30); App.save(); UI.refreshAll(); }
        if (k === 's' || k === 'arrowdown') { ev.preventDefault(); S.swing.attack = U.clamp(S.swing.attack - 1, -10, 30); App.save(); UI.refreshAll(); }
        const types = { 1: 'contact', 2: 'normal', 3: 'power' };
        if (types[k]) { S.swing.type = types[k]; App.save(); UI.refreshAll(); App.emit('swing'); }
      } else if (rl.pitcherUser && /^[1-8]$/.test(k) && R.phase === 'ready') App.selectPitch(+k - 1);
    });
    G.addEventListener('resize', () => R.render.resize());
    if (G.ResizeObserver) new ResizeObserver(() => R.render.resize()).observe(vp);
  }

  App.setMode = (m) => {
    const S = App.S;
    S.mode = m; App.save();
    document.querySelectorAll('.modes button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === m)));
    R.phase = 'ready'; R.readyT = 0; R.E = null; R.meter = null; R.replay = null;
    if (R.group) stopGroup();
    R.render.clearPieces();
    clearHud();
    document.getElementById('banner').classList.remove('show');
    if (R.fx) R.fx.clear();
    R.freeze = 0; R.slow = null;
    App.setCamera(S.cam[camKey()], true);
    R.dirty = true; lastLinesKey = '';
    App.emit('mode');
  };

  // ---------------------------------------------------------------- boot
  App.init = () => {
    App.S = load();
    App.cage = freshCage();
    const S = App.S;
    const vp = document.getElementById('viewport');
    R.render = new Rn.Renderer(vp);
    R.render.setStadium(S.env.stadium);
    R.render.setBat(App.bat());
    const layer = h('div', { class: 'fx-layer', 'aria-hidden': 'true' }), vig = h('div', { class: 'fx-vig', 'aria-hidden': 'true' });
    R.hud = h('canvas', { class: 'hit-hud', 'aria-hidden': 'true' });
    vp.append(R.hud, vig, layer);
    R.render.setGhostBat(App.bat());
    R.fx = new BP.FX(R.render, layer, vig);
    R.fx.level = S.fx;
    const fxSel = document.getElementById('fx-level');
    fxSel.value = S.fx;
    fxSel.addEventListener('change', () => { S.fx = fxSel.value; R.fx.level = S.fx; App.save(); if (S.fx === 'off') R.fx.clear(); });
    // top bar
    document.querySelectorAll('.modes button').forEach((b) => b.addEventListener('click', () => App.setMode(b.dataset.mode)));
    document.getElementById('env-chip').addEventListener('click', () => UI.openDrawer('drawer-env'));
    document.getElementById('btn-phys').append(UI.icon('gear'));
    document.getElementById('btn-phys').addEventListener('click', () => UI.openDrawer('drawer-phys'));
    document.getElementById('btn-help').append(UI.icon('help'));
    document.getElementById('btn-help').addEventListener('click', () => UI.openDrawer('drawer-help'));
    const sb = document.getElementById('btn-sound');
    const setSound = () => { sb.innerHTML = ''; sb.append(UI.icon(S.sound ? 'sound' : 'mute')); sb.setAttribute('aria-label', S.sound ? 'Sound on' : 'Sound off'); Audio.enabled = S.sound; };
    sb.addEventListener('click', () => { S.sound = !S.sound; App.save(); setSound(); Audio.unlock(); });
    setSound();
    const spd = document.getElementById('sim-speed');
    spd.value = String(S.simSpeed);
    spd.addEventListener('change', () => { S.simSpeed = parseFloat(spd.value); App.save(); });
    // cameras
    const cams = document.getElementById('cams');
    CAMS.forEach(([k, label]) => cams.append(h('button', { type: 'button', 'data-cam': k, 'aria-pressed': 'false', onclick: () => App.setCamera(k) }, label)));
    // bottom-right buttons
    const br = document.getElementById('hud-br');
    const tReplay = h('button', { class: 'btn-hud', type: 'button', title: 'Replay every pitch in the tunnel set together (T)', onclick: () => (R.group ? stopGroup() : App.replayTunnel()) }, 'Replay set');
    const tClear = h('button', { class: 'btn-hud', type: 'button', title: 'Clear the tunnel set (X)', onclick: () => App.clearTunnel() }, 'Clear set');
    br.append(tReplay, tClear, h('button', { class: 'btn-hud', type: 'button', title: 'Slow-motion replay of the last pitch (R)', onclick: () => App.replay() }, 'Replay'));
    const syncTunnelBtns = () => {
      const bp = S.mode === 'bullpen', n = R.tunnel.length;
      tReplay.hidden = tClear.hidden = !bp;
      tReplay.textContent = R.group ? 'Stop set' : `Replay set${n ? ' · ' + n : ''}`;
      tReplay.disabled = !n && !R.group; tClear.disabled = !n;
    };
    App.on('tunnel', syncTunnelBtns); App.on('mode', syncTunnelBtns);
    // drawers & panels
    UI.buildEnvDrawer(App); UI.buildPhysicsDrawer(App); UI.buildHelpDrawer();
    BP.Panels.buildRail(App);
    bindInput();
    updateEnvChip();
    App.setMode(S.mode);
    App.pitchChanged();
    App.emit('bat'); App.emit('cage');
    document.getElementById('loading').remove();
    let last = performance.now();
    const loop = (now) => {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      try {
        R.lastNow = now; R.lastDt = dt;
        update(dt);
        drawScene(dt);
        renderSituation(); renderBottom(); renderPrompt();
        R.fx.update(R.replay ? R.presDt || 0 : R.presDt != null ? R.presDt : dt, dt);
        R.render.render(dt);
        App.emit('frame', dt);
      } catch (e) {
        console.error(e);
      }
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
    // keep settings across live updates of the page
    if (G.claude && G.claude.hot && G.claude.hot.snapshot) G.claude.hot.snapshot(() => ({ S: App.S }));
  };

  BP.App = App;
  const boot = () => {
    if (typeof THREE === 'undefined') {
      const l = document.getElementById('loading');
      if (l) l.textContent = 'The 3D library could not load. Check your connection and reload.';
      return;
    }
    App.init();
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})(typeof window !== 'undefined' ? window : globalThis);

</script>

</body></html>
