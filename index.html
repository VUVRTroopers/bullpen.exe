<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>bullpen.exe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A physics-driven baseball simulator: design pitches from spin, seams and air; hit by intercepting the ball with a real bat.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Big+Shoulders+Display:wght@600;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* bullpen.exe — interface
 * Layout: full-bleed 3D field on the left, an instrument rail on the right; drawers slide over the rail.
 * One visual world (night game under the lights), so a single dark palette with explicit colors.
 */
:root {
  --night: #0c1215;      /* page / sky */
  --rail: #11191d;       /* instrument rail */
  --rail-2: #172227;     /* raised controls */
  --rail-3: #1e2c32;     /* hover */
  --rule: #253840;       /* chalk hairlines */
  --chalk: #ece6d6;      /* horsehide cream — primary ink */
  --chalk-dim: #a3aea9;  /* secondary ink */
  --chalk-mute: #6d7d80; /* labels, units */
  --stitch: #e04a3c;     /* seam red — live state & primary action */
  --stitch-ink: #fff4ef;
  --clay: #d08a52;       /* infield clay — data highlights */
  --grass: #5aa775;
  --good: #6cc08b;
  --warn: #e8b04a;
  --bad: #ef6a57;
  --font-display: 'Big Shoulders Display', 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --font-body: 'Barlow', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-data: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --rail-w: 392px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night);
  color: var(--chalk);
  font: 400 14px/1.4 var(--font-body);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--clay); outline-offset: 2px; }

#app {
  height: 100%;
  display: grid;
  grid-template-rows: auto 1fr;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 14px;
  gap: 10px;
}

/* ---- top bar ----------------------------------------------------------- */
.topbar { display: flex; align-items: center; gap: 18px; min-width: 0; flex-wrap: wrap; }
.wordmark { display: flex; align-items: baseline; gap: 1px; user-select: none; white-space: nowrap; }
.wordmark b { font: 800 30px/1 var(--font-display); letter-spacing: 0.02em; text-transform: uppercase; color: var(--chalk); }
.wordmark i { font: 600 15px/1 var(--font-data); font-style: normal; color: var(--stitch); letter-spacing: -0.02em; }
.modes { display: flex; gap: 2px; background: var(--rail); border: 1px solid var(--rule); border-radius: 8px; padding: 3px; }
.modes button { border: 0; background: transparent; padding: 6px 14px; border-radius: 6px; cursor: pointer; font: 600 13px/1 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--chalk-dim); }
.modes button:hover { color: var(--chalk); background: var(--rail-2); }
.modes button[aria-pressed="true"] { background: var(--chalk); color: var(--night); }
.topbar .spacer { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--rule); background: var(--rail); border-radius: 999px; padding: 6px 12px; cursor: pointer; white-space: nowrap; min-width: 0; }
.chip:hover { background: var(--rail-2); }
.chip .k { color: var(--chalk-mute); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
.chip .v { font: 400 12px/1 var(--font-data); color: var(--chalk); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--clay); }
.iconbtn { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid var(--rule); background: var(--rail); border-radius: 8px; cursor: pointer; color: var(--chalk-dim); }
.iconbtn:hover { color: var(--chalk); background: var(--rail-2); }
.iconbtn svg { width: 18px; height: 18px; }
.speed { display: flex; align-items: center; gap: 6px; }
.speed select { background: var(--rail); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 8px; font: 400 12px var(--font-data); }

/* ---- stage ------------------------------------------------------------- */
.stage { display: grid; grid-template-columns: minmax(0, 1fr) var(--rail-w); gap: 12px; min-height: 0; }
.viewport { position: relative; min-width: 0; min-height: 0; border-radius: 12px; overflow: hidden; background: #0a1013; border: 1px solid var(--rule); touch-action: none; container-type: inline-size; }
.viewport canvas.gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.viewport.aiming { cursor: none; }

.rail { min-height: 0; overflow-y: auto; overflow-x: hidden; background: var(--rail); border: 1px solid var(--rule); border-radius: 12px; scrollbar-width: thin; scrollbar-color: var(--rule) transparent; }
.rail-inner { display: flex; flex-direction: column; }

/* ---- overlay HUD ------------------------------------------------------- */
.hud { position: absolute; pointer-events: none; }
.hud > * { pointer-events: auto; }
.hud-tl { top: 10px; left: 10px; display: flex; gap: 6px; flex-wrap: wrap; max-width: calc(100% - 20px); }
.hud-tr { top: 10px; right: 10px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
/* one row that never wraps on a normal-width field: the telemetry card may narrow, the controls keep their
   size, the replay buttons stack. (A wrapping row made controls jump a whole line up when a card appeared.) */
.hud-bottom { left: 10px; right: 10px; bottom: 10px; display: flex; align-items: flex-end; gap: 10px; flex-wrap: nowrap; pointer-events: none; }
.hud-bottom > * { pointer-events: auto; }
.hud-bl { flex: 0 1 auto; max-width: min(372px, 100%); min-width: 0; }
.hud-bc { flex: none; margin-inline: auto; }
.hud-bc.side { margin-left: auto; margin-right: 0; }
.hud-br { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
/* narrow fields (phones): fixed rows from the bottom up — the control you are using, the telemetry card,
   then the replay buttons — so a card appearing only ever pushes things straight up, never across */
@container (max-width: 640px) {
  .hud-bottom { flex-direction: column-reverse; align-items: stretch; gap: 8px; }
  .hud-bc, .hud-bc.side { order: 0; margin-inline: auto; }
  .hud-bl { order: 1; max-width: 100%; }
  .hud-br { order: 2; flex-direction: row; align-self: flex-end; }
}
.cams { display: flex; gap: 2px; background: rgba(12, 18, 21, 0.78); border: 1px solid var(--rule); border-radius: 8px; padding: 3px; backdrop-filter: blur(6px); }
.cams button { border: 0; background: transparent; color: var(--chalk-dim); padding: 4px 9px; border-radius: 5px; cursor: pointer; font: 500 12px/1.2 var(--font-body); letter-spacing: 0.04em; }
.cams button:hover { color: var(--chalk); }
.cams button[aria-pressed="true"] { background: var(--rail-3); color: var(--chalk); }
.glass { background: rgba(12, 18, 21, 0.82); border: 1px solid var(--rule); border-radius: 10px; backdrop-filter: blur(8px); }
.btn-hud { border: 1px solid var(--rule); background: rgba(12, 18, 21, 0.82); color: var(--chalk); border-radius: 8px; padding: 7px 12px; cursor: pointer; font: 600 12px/1 var(--font-body); letter-spacing: 0.06em; text-transform: uppercase; backdrop-filter: blur(6px); }
.btn-hud:hover { background: var(--rail-2); }
.btn-hud:disabled { opacity: 0.4; cursor: default; }

.banner { position: absolute; left: 50%; top: 18%; transform: translate(-50%, -8px); text-align: center; pointer-events: none; opacity: 0; transition: opacity 180ms ease, transform 220ms ease; }
.banner.show { opacity: 1; transform: translate(-50%, 0); }
.banner .t { font: 800 clamp(30px, 5.2vw, 64px)/0.95 var(--font-display); text-transform: uppercase; letter-spacing: 0.02em; color: var(--chalk); text-shadow: 0 2px 18px rgba(0, 0, 0, 0.7); }
.banner .s { margin-top: 6px; font: 400 13px/1.3 var(--font-data); color: var(--chalk); text-shadow: 0 1px 8px rgba(0, 0, 0, 0.9); }
.banner.hot .t { color: var(--stitch); }

.prompt { position: absolute; left: 10px; top: 50px; max-width: calc(100% - 20px); padding: 6px 12px; font: 500 12px/1.5 var(--font-body); color: var(--chalk-dim); }
.prompt kbd, .help kbd { font: 600 11px/1 var(--font-data); background: var(--rail-3); border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; padding: 2px 5px; color: var(--chalk); }

/* telemetry card */
.tele { padding: 9px 11px; min-width: 0; max-height: 46vh; overflow-y: auto; }
.tele h4 { margin: 0 0 6px; font: 600 11px/1 var(--font-body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--chalk-mute); display: flex; gap: 8px; align-items: center; }
.tele h4 .tag { color: var(--night); background: var(--chalk); border-radius: 4px; padding: 2px 5px; letter-spacing: 0.06em; }
.tele-grid { display: grid; grid-template-columns: repeat(4, minmax(0, auto)); gap: 4px 16px; }
.tele-grid div { display: flex; flex-direction: column; min-width: 0; }
.tele-grid .k { font: 500 10px/1.2 var(--font-body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--chalk-mute); white-space: nowrap; }
.tele-grid .v { font: 400 13px/1.25 var(--font-data); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tele-grid .v small { color: var(--chalk-mute); font-size: 10px; margin-left: 2px; }
.tele .note { margin-top: 6px; font: 400 11px/1.35 var(--font-data); color: var(--chalk-dim); }

/* scoreboard */
.score { padding: 8px 10px; font: 400 12px/1 var(--font-data); }
.score table { border-collapse: collapse; }
.score th, .score td { padding: 3px 5px; text-align: center; font-variant-numeric: tabular-nums; }
.score th { font: 500 10px/1 var(--font-body); color: var(--chalk-mute); letter-spacing: 0.08em; }
.score td.team { text-align: left; font: 600 11px/1 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; padding-right: 10px; }
.score td.r { color: var(--chalk); font-weight: 600; border-left: 1px solid var(--rule); }
.score .live { color: var(--clay); }
.situation { display: flex; align-items: center; gap: 14px; padding: 8px 12px; }
.count { font: 600 15px/1 var(--font-data); letter-spacing: 0.04em; }
.count small { font: 500 10px/1 var(--font-body); color: var(--chalk-mute); letter-spacing: 0.1em; margin-left: 4px; }
.outs { display: flex; gap: 4px; }
.outs i { width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--chalk-mute); }
.outs i.on { background: var(--stitch); border-color: var(--stitch); }
.diamond { width: 34px; height: 34px; }

/* delivery meter / swing HUD */
.meter { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.meter canvas { width: 480px; max-width: calc(100vw - 72px); height: 128px; display: block; }
.meter .hint { font: 500 11px/1.2 var(--font-body); color: var(--chalk-dim); letter-spacing: 0.04em; text-align: center; }
.swinghud { display: flex; gap: 14px; align-items: center; padding: 8px 12px; }
.swinghud .gauge { display: flex; flex-direction: column; gap: 2px; align-items: center; }
.swinghud .gauge canvas { width: 92px; height: 52px; }
.swinghud .k { font: 500 10px/1 var(--font-body); color: var(--chalk-mute); letter-spacing: 0.1em; text-transform: uppercase; }
.swinghud .v { font: 400 13px/1 var(--font-data); }
.seg { display: flex; gap: 2px; background: var(--rail-2); border-radius: 7px; padding: 2px; }
.seg button { border: 0; background: transparent; color: var(--chalk-dim); padding: 5px 9px; border-radius: 5px; cursor: pointer; font: 500 12px/1 var(--font-body); white-space: nowrap; }
.seg button:hover { color: var(--chalk); }
.seg button[aria-pressed="true"] { background: var(--chalk); color: var(--night); }
.swingbtn { display: none; }

/* ---- rail sections ------------------------------------------------------ */
.sec { border-bottom: 1px solid var(--rule); }
.sec:last-child { border-bottom: 0; }
.sec > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 12px 16px; user-select: none; }
.sec > summary::-webkit-details-marker { display: none; }
.sec > summary h3 { margin: 0; font: 800 18px/1 var(--font-display); letter-spacing: 0.04em; text-transform: uppercase; }
.sec > summary .meta { margin-left: auto; font: 400 11px/1 var(--font-data); color: var(--chalk-mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.sec > summary::after { content: ''; width: 7px; height: 7px; border-right: 1.5px solid var(--chalk-mute); border-bottom: 1.5px solid var(--chalk-mute); transform: rotate(-45deg); transition: transform 150ms; flex: none; }
.sec[open] > summary::after { transform: rotate(45deg); }
.sec .body { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.sub { font: 600 11px/1 var(--font-body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--chalk-mute); padding-top: 4px; display: flex; align-items: center; gap: 8px; }
.sub::after { content: ''; flex: 1; border-top: 1px dashed var(--rule); }
.blurb { margin: 0; color: var(--chalk-dim); font-size: 13px; line-height: 1.45; }
.blurb b { color: var(--chalk); font-weight: 600; }

/* controls */
.row { display: grid; grid-template-columns: 104px minmax(0, 1fr) 74px; align-items: center; gap: 10px; }
.row label { font: 500 12px/1.2 var(--font-body); color: var(--chalk-dim); }
.row output, .row .val { font: 400 12px/1 var(--font-data); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row output small, .val small { color: var(--chalk-mute); font-size: 10px; margin-left: 2px; }
.row input[type="text"].val { width: 100%; background: var(--rail-2); border: 1px solid var(--rule); border-radius: 5px; padding: 4px 6px; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track { height: 3px; background: linear-gradient(90deg, var(--clay) var(--p, 50%), var(--rule) var(--p, 50%)); border-radius: 2px; }
input[type="range"]::-moz-range-track { height: 3px; background: var(--rule); border-radius: 2px; }
input[type="range"]::-moz-range-progress { height: 3px; background: var(--clay); border-radius: 2px; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5.5px; border-radius: 50%; background: var(--chalk); border: 2px solid var(--night); box-shadow: 0 0 0 1px var(--rule); }
input[type="range"]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--chalk); border: 2px solid var(--night); }
select.sel, input.txt { width: 100%; background: var(--rail-2); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 8px; font-size: 13px; min-width: 0; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--chalk-dim); cursor: pointer; }
.toggle input { accent-color: var(--clay); width: 15px; height: 15px; }
.btn { border: 1px solid var(--rule); background: var(--rail-2); border-radius: 7px; padding: 8px 12px; cursor: pointer; font: 600 12px/1 var(--font-body); letter-spacing: 0.06em; text-transform: uppercase; color: var(--chalk); }
.btn:hover { background: var(--rail-3); }
.btn.primary { background: var(--stitch); border-color: var(--stitch); color: var(--stitch-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

/* arsenal list */
.arsenal { display: flex; flex-direction: column; gap: 4px; }
.prow { display: grid; grid-template-columns: 22px 28px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 7px 8px; border: 1px solid transparent; border-radius: 8px; cursor: pointer; background: transparent; text-align: left; width: 100%; }
.prow:hover { background: var(--rail-2); }
.prow[aria-pressed="true"] { background: var(--rail-2); border-color: var(--rule); }
.prow .key { font: 600 11px/1 var(--font-data); color: var(--chalk-mute); }
.prow .code { font: 600 11px/1 var(--font-data); padding: 3px 0; border-radius: 4px; text-align: center; color: #0c1215; }
.prow .nm { font: 600 13px/1.2 var(--font-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow .nums { font: 400 11px/1.2 var(--font-data); color: var(--chalk-dim); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* metrics grid */
.metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.metrics div { background: var(--rail); padding: 7px 9px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.metrics .k { font: 500 10px/1.1 var(--font-body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--chalk-mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.metrics .v { font: 400 15px/1.15 var(--font-data); font-variant-numeric: tabular-nums; white-space: nowrap; }
.metrics .v small { font-size: 10px; color: var(--chalk-mute); margin-left: 2px; }
.metrics .v.hi { color: var(--clay); }

.canvas-wrap { position: relative; width: 100%; }
.canvas-wrap canvas { width: 100%; display: block; border-radius: 8px; background: #0e1619; border: 1px solid var(--rule); }
.tip { position: absolute; pointer-events: none; background: var(--rail-3); border: 1px solid var(--rule); border-radius: 6px; padding: 5px 8px; font: 400 11px/1.35 var(--font-data); white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); z-index: 5; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font: 400 11px/1 var(--font-data); color: var(--chalk-dim); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 14px; height: 0; border-top: 2px solid; display: inline-block; }
.legend i.dash { border-top-style: dashed; }
.legend i.dot { border-top-style: dotted; }

.ballwrap { display: grid; grid-template-columns: 148px minmax(0, 1fr); gap: 12px; align-items: center; }
.ballwrap canvas { width: 148px; height: 148px; cursor: grab; background: transparent; border: 0; touch-action: none; }
.ballwrap canvas:active { cursor: grabbing; }
.dialwrap { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px; align-items: center; }
.dialwrap canvas { width: 112px; height: 112px; cursor: pointer; touch-action: none; }
.kv { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.kv div { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--chalk-dim); }
.kv div b { font: 400 12px/1.2 var(--font-data); color: var(--chalk); font-weight: 400; white-space: nowrap; }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.stats div { display: flex; flex-direction: column; gap: 2px; }
.stats .k { font: 500 10px/1 var(--font-body); color: var(--chalk-mute); letter-spacing: 0.1em; text-transform: uppercase; }
.stats .v { font: 400 16px/1.1 var(--font-data); font-variant-numeric: tabular-nums; }
.log { display: flex; flex-direction: column; gap: 0; max-height: 260px; overflow-y: auto; font: 400 12px/1.35 var(--font-data); }
.log div { padding: 5px 0; border-bottom: 1px dashed var(--rule); color: var(--chalk-dim); }
.log div.ev { display: flex; gap: 8px; }
.log div b { color: var(--chalk); font-weight: 600; }
.log div .t { color: var(--chalk-mute); flex: none; }

/* ---- drawers ------------------------------------------------------------ */
.scrim { position: fixed; inset: 0; background: rgba(5, 8, 10, 0.5); opacity: 0; pointer-events: none; transition: opacity 160ms; z-index: 20; }
.scrim.on { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); background: var(--rail); border-left: 1px solid var(--rule); z-index: 21; transform: translateX(102%); transition: transform 220ms ease; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.drawer.on { transform: none; }
.drawer header { display: flex; align-items: center; gap: 10px; padding: 16px 18px 12px; border-bottom: 1px solid var(--rule); }
.drawer header h2 { margin: 0; font: 800 24px/1 var(--font-display); text-transform: uppercase; letter-spacing: 0.03em; }
.drawer header .iconbtn { margin-left: auto; }
.drawer .dbody { overflow-y: auto; padding: 14px 18px 24px; display: flex; flex-direction: column; gap: 14px; }
.parks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.park { text-align: left; border: 1px solid var(--rule); background: var(--rail-2); border-radius: 8px; padding: 8px 10px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.park:hover { background: var(--rail-3); }
.park[aria-pressed="true"] { border-color: var(--clay); box-shadow: inset 0 0 0 1px var(--clay); }
.park b { font: 600 13px/1.2 var(--font-body); }
.park span { font: 400 11px/1.3 var(--font-data); color: var(--chalk-mute); }
.readout { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.readout div { background: var(--rail); padding: 8px 10px; display: flex; flex-direction: column; gap: 3px; }
.readout .k { font: 500 10px/1.1 var(--font-body); color: var(--chalk-mute); letter-spacing: 0.1em; text-transform: uppercase; }
.readout .v { font: 400 15px/1.1 var(--font-data); }

/* bullpen.exe — core math & unit utilities

 * Coordinate frame (Statcast convention, SI units):
 *   origin = back tip of home plate, +x = catcher's right (1B side),
 *   +y = toward the pitcher / center field, +z = up.

  U.PLATE_FRONT = 17 * 0.0254; // y of the plate's front edge (m)

/* js/core/atmosphere.js */
/* bullpen.exe — atmosphere & environment model

  'use strict';

  const U = BP.U;

    humidity: 50,

  };

  // Fence distances (ft) at LF line, LCF, CF, RCF, RF line and wall heights (ft) at the same angles.
  const STADIUMS = {
    neutral: { name: 'Neutral Park', sub: 'Sea level · standard day', altitudeFt: 0, tempF: 70, humidity: 50, baroInHg: 29.92, windMph: 0, windDir: 0,
      fence: [330, 375, 400, 375, 330], wall: [8, 8, 8, 8, 8] },
    denver: { name: 'Denver', sub: '5,200 ft · thin, dry air', altitudeFt: 5200, tempF: 78, humidity: 30, baroInHg: 30.0, windMph: 4, windDir: 20,
      fence: [347, 390, 415, 375, 350], wall: [8, 8, 8, 14, 14] },
    mexico: { name: 'Mexico City', sub: '7,350 ft · thinnest air in pro ball', altitudeFt: 7350, tempF: 72, humidity: 45, baroInHg: 30.0, windMph: 3, windDir: 0,
      fence: [332, 375, 410, 375, 332], wall: [10, 10, 10, 10, 10] },
    seattle: { name: 'Seattle', sub: 'Sea level · cool marine air', altitudeFt: 20, tempF: 58, humidity: 82, baroInHg: 30.1, windMph: 6, windDir: 160,
      fence: [331, 378, 401, 381, 326], wall: [8, 8, 8, 8, 8] },
    boston: { name: 'Boston', sub: 'Short LF, 37-ft wall', altitudeFt: 20, tempF: 72, humidity: 62, baroInHg: 29.95, windMph: 7, windDir: 250,
      fence: [310, 379, 390, 380, 302], wall: [37, 37, 17, 5, 5] },
    bronx: { name: 'New York', sub: 'Short RF porch', altitudeFt: 55, tempF: 82, humidity: 58, baroInHg: 29.9, windMph: 5, windDir: 30,
      fence: [318, 399, 408, 385, 314], wall: [8, 8, 8, 8, 8] },
    phoenix: { name: 'Phoenix', sub: '1,100 ft · 104°F, bone dry', altitudeFt: 1100, tempF: 104, humidity: 10, baroInHg: 29.85, windMph: 3, windDir: 90,
      fence: [330, 374, 407, 374, 335], wall: [8, 8, 25, 8, 8] },
    chicago: { name: 'Chicago (April)', sub: '600 ft · 44°F, wind in off the lake', altitudeFt: 600, tempF: 44, humidity: 70, baroInHg: 30.05, windMph: 15, windDir: 180,
      fence: [355, 368, 400, 368, 353], wall: [11.5, 11.5, 11.5, 11.5, 11.5] },
    dome: { name: 'Houston (roof closed)', sub: '40 ft · climate controlled', altitudeFt: 40, tempF: 72, humidity: 50, baroInHg: 29.92, windMph: 0, windDir: 0,

  function interpProfile(arr, sprayDeg) {
    const a = U.clamp(sprayDeg, -45, 45);
    for (let i = 0; i < 4; i++) {
      if (a <= FENCE_ANGLES[i + 1]) {
        const t = (a - FENCE_ANGLES[i]) / 22.5;
        const s = 0.5 - 0.5 * Math.cos(Math.PI * t); // cosine blend → rounded fence

    const pv = U.clamp(env.humidity, 0, 100) / 100 * satVapor(Tc);

    const mu = 1.716e-5 * Math.pow(T / 273.15, 1.5) * (273.15 + 110.4) / (T + 110.4);
    const g0 = phys.gravity != null ? phys.gravity : 9.80665;

    const ws = env.windMph * U.MPH;

    // standard sea-level density for comparison (59°F, 29.92 inHg, dry)
    const rhoStd = 1.2250;

    const st = STADIUMS[stadium] || STADIUMS.neutral;
    return { dist: interpProfile(st.fence, sprayDeg) * U.FT, height: interpProfile(st.wall, sprayDeg) * U.FT };

<script>
/* js/core/seams.js */
/* bullpen.exe — seam geometry & seam-shifted wake (SSW)
 *
 * Seam: the classic "tennis-ball curve" on the unit sphere, a closed figure-8 that splits the
 * ball into two congruent leather pieces.
 *
 * SSW model: boundary-layer separation on a baseball happens near a ring ~100–110° from the
 * forward stagnation point. A seam sitting in that ring trips early separation on its side; the wake
 * shifts toward that side and the ball is pushed the other way. We integrate seam length that falls
 * inside the separation band (Gaussian kernel in polar angle θ from the stagnation point) and sum the
 * radial directions → an asymmetry vector A. Force = ½ρAv²·K_ssw·(−A).
 *
 *  • Instantaneous mode (low spin, e.g. knuckleballs): seam points are rotated to the ball's true
 *    orientation every force evaluation → the erratic flutter emerges with no randomness.
 *  • Averaged mode (normal spin): the ball turns 30–45 times on the way in, so we use the exact
 *    rotation-average of the instantaneous model, precomputed as a table over ψ (angle between
 *    spin axis and velocity). By symmetry the averaged force lies along the spin axis' projection
 *    perpendicular to velocity, i.e. 90° from the Magnus force — which is what SSW looks like in data.

  'use strict';

  const SEAM_B = 0.3; // shape parameter of the seam curve (a = 1 - b)

  function seamPoint(t, b = SEAM_B) {

    return [a * Math.cos(t) + b * Math.cos(3 * t), a * Math.sin(t) - b * Math.sin(3 * t), c * Math.sin(2 * t)];
  }

  // Sample the seam with arc-length weights (unit sphere)
  function curve(n = 160, b = SEAM_B) {
    const pts = [], w = [];
    let total = 0;
    for (let i = 0; i < n; i++) {
      const t = (i / n) * 2 * Math.PI;
      const p = seamPoint(t, b);
      const p2 = seamPoint(t + 1e-4, b);
      const ds = U.dist(p, p2) / 1e-4 * (2 * Math.PI / n);
      pts.push(p); w.push(ds); total += ds;

    v = U.norm(v);

    setStadium(key) {

    setBat(bat) {

    placeBat(knob, dir, visible) {

    }

    setZone(zone, visible) {

      });

    static camPreset(name, ctx = {}) {

        case 'pitcher': return { pos: [c * 0.55, U.RUBBER + 3.2, 2.35], tgt: [0, 0, 0.75], fov: 24 };
        case 'side': return { pos: [13.5, 9.0, 2.0], tgt: [0, 9.0, 1.3], fov: 64 };
        case 'overhead': return { pos: [0.01, 9.2, 28], tgt: [0, 9.2, 0], fov: 46 };
        case 'broadcast': return { pos: [-9.5, 104, 9.2], tgt: [0, 0.5, 1.0], fov: 3.6 };

    _fitShadow(name) {

    shake(amp, dur, punch) { this.shk = { amp, dur: dur || 0.3, age: 0, punch: punch || 0 }; }

    resize() {
      const r = this.container.getBoundingClientRect();

    }
    // screen px → point on the plane y = yPlane (physics)
    unprojectToY(px, py, yPlane) {

      ndc.unproject(this.camera);
      const o = this.camera.position, d = ndc.sub(o).normalize();
      const t = (-yPlane - o.z) / d.z;

      return [o.x + d.x * t, yPlane, o.y + d.y * t];
    }

    render(dt) {
      const cs = this.camState;
      if (this.camGoal) {
        const k = 1 - Math.exp(-dt * 5);
        for (let i = 0; i < 3; i++) { cs.pos[i] += (this.camGoal.pos[i] - cs.pos[i]) * k; cs.tgt[i] += (this.camGoal.tgt[i] - cs.tgt[i]) * k; }

        if (U.dist(cs.pos, this.camGoal.pos) < 0.01 && Math.abs(cs.fov - this.camGoal.fov) < 0.01) this.camGoal = null;
      }
      if (this.camName === 'follow' && this.followP) {
        const p = this.followP;
        const r = Math.hypot(p[0], p[1]);
        const want = { pos: [p[0] * 0.25, Math.min(-12, p[1] * 0.12 - 14), 14 + r * 0.12], tgt: [p[0], p[1], Math.max(1, p[2] * 0.8)], fov: 52 };
        const k = 1 - Math.exp(-dt * 3);
        for (let i = 0; i < 3; i++) { cs.pos[i] += (want.pos[i] - cs.pos[i]) * k; cs.tgt[i] += (want.tgt[i] - cs.tgt[i]) * k; }
      }
      setV(this.camera.position, cs.pos);
      this.camera.lookAt(V(cs.tgt));
      let fov = cs.fov;
      if (this.shk) {
        const k = this.shk;
        k.age += dt;
        const f = Math.max(0, 1 - k.age / k.dur);
        if (f <= 0) this.shk = null;
        else {
          const a = k.amp * f * f * (cs.fov * Math.PI / 180), t = k.age * 60;
          this.camera.rotateX(Math.sin(t * 1.7 + 0.3) * a);

        }
      }
      if (Math.abs(this.camera.fov - fov) > 1e-4) { this.camera.fov = fov; this.camera.updateProjectionMatrix(); }

      if (this.camName === 'catcher') { this.figs.catcher.g.visible = false; this.figs.ump.g.visible = false; }
      if (this.quality === 'high') this.post.render(this.scene, this.camera);
      else { this.gl.setRenderTarget(null); this.gl.render(this.scene, this.camera); }
    }
  }

  BP.Render = { Renderer, Pose: Fig.Pose, poseFigure: Fig.poseFigure, setTeam: Fig.setTeam, COLORS: Fig.COLORS, V };
})(typeof window !== 'undefined' ? window : globalThis);

  const U = BP.U, Seams = BP.Seams, Atmos = BP.Atmos, Pitching = BP.Pitching;

  const C = {
    ink: '#ece6d6', dim: '#a3aea9', mute: '#6d7d80', rule: '#253840', grid: 'rgba(236,230,214,0.07)', surface: '#0e1619',
    stitch: '#e04a3c', clay: '#d08a52', good: '#6cc08b', leather: '#efe9da',
  };
  const FONT = (w, s, fam) => `${w} ${s}px ${fam === 'data' ? '"JetBrains Mono", ui-monospace, monospace' : fam === 'display' ? '"Big Shoulders Display", "Arial Narrow", sans-serif' : 'Barlow, system-ui, sans-serif'}`;

  function fit(canvas, h) {
    const dpr = Math.min(2, G.devicePixelRatio || 1);
    const w = canvas.clientWidth || canvas.parentElement.clientWidth || 300;
    const hh = h || canvas.clientHeight || 150;
    if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(hh * dpr)) {
      canvas.width = Math.round(w * dpr); canvas.height = Math.round(hh * dpr);
    }
    const g = canvas.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { g, w, h: hh };
  }

  // ------------------------------------------------------------- seam ball
  class SeamBall {
    constructor(canvas, onChange) {
      this.c = canvas; this.onChange = onChange; this.anim = 0; this.state = null;
      this.view = (() => {
        const e = 16 * U.DEG;
        const fwd = U.norm([-Math.cos(e), 0, -Math.sin(e)]);
        const right = [0, 1, 0];
        const up = U.cross(right, fwd);
        return { fwd, right, up, toCam: U.scale(fwd, -1) };
      })();
      let drag = null;
      canvas.addEventListener('pointerdown', (ev) => { drag = { x: ev.clientX, y: ev.clientY }; canvas.setPointerCapture(ev.pointerId); });
      canvas.addEventListener('pointermove', (ev) => {
        if (!drag || !this.state) return;
        const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
        drag = { x: ev.clientX, y: ev.clientY };
        this._rotate(dx, dy);
      });
      canvas.addEventListener('pointerup', () => { drag = null; });
    }
    set(state) { this.state = state; }
    _rotate(dx, dy) {
      const st = this.state;
      const k = 0.012;
      // D: world rotation from the drag
      let D = U.m3rot(this.view.up, dx * k);
      D = U.m3mul(U.m3rot(this.view.right, dy * k), D);
      const R0 = st.R0;
      const R1 = U.m3mul(D, R0);
      const sB = U.m3v(U.m3T(R1), st.axis);
      const ll = Seams.latLonFromAxis(sB);
      // recover phase so releaseOrientation(sB, axis, up, phase) == R1
      const Rz = Seams.releaseOrientation(sB, st.axis, st.up, 0);
      let ab = U.cross([0, 0, 1], U.norm(sB));
      if (U.len(ab) < 1e-6) ab = U.cross([1, 0, 0], U.norm(sB));
      ab = U.norm(ab);
      const x0 = U.m3v(Rz, ab), x1 = U.m3v(R1, ab);
      const phase = Math.atan2(U.dot(U.cross(x0, x1), st.axis), U.dot(x0, x1)) / U.DEG;
      this.onChange && this.onChange({ lat: ll.lat, lon: ll.lon, phase: U.wrap180(phase) });
    }
    draw(dt) {
      const st = this.state;
      const { g, w, h } = fit(this.c, 148);
      g.clearRect(0, 0, w, h);
      if (!st) return;
      const cx = w / 2, cy = h / 2 - 8, R = Math.min(w, h) * 0.33;
      this.anim += (dt || 0) * Math.min(1.2, Math.max(0.05, st.rpm / 2400));
      const Rt = U.m3mul(U.m3rot(st.axis, this.anim * 2 * Math.PI * 0.6), st.R0);
      const vw = this.view;
      const proj = (q) => [cx + R * U.dot(q, vw.right), cy - R * U.dot(q, vw.up), U.dot(q, vw.toCam)];
      // ball
      const grad = g.createRadialGradient(cx - R * 0.35, cy - R * 0.4, R * 0.1, cx, cy, R * 1.05);
      grad.addColorStop(0, '#fbf7ec'); grad.addColorStop(0.7, '#d9d0bc'); grad.addColorStop(1, '#8f8676');
      g.fillStyle = grad; g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.fill();
      // separation ring
      const vh = U.norm(st.vel);
      const ts = st.sepAngle * U.DEG, sw = st.sepWidth * U.DEG;
      const e1 = U.perp(vh), e2 = U.cross(vh, e1);
      g.lineWidth = 1.2;
      for (let pass = 0; pass < 2; pass++) {
        g.beginPath();
        let first = true;
        for (let i = 0; i <= 72; i++) {
          const a = (i / 72) * 2 * Math.PI;
          const q = U.add(U.scale(vh, Math.cos(ts)), U.add(U.scale(e1, Math.sin(ts) * Math.cos(a)), U.scale(e2, Math.sin(ts) * Math.sin(a))));
          const p = proj(q);
          const front = p[2] >= 0;
          if ((pass === 1) !== front) { first = true; continue; }
          if (first) { g.moveTo(p[0], p[1]); first = false; } else g.lineTo(p[0], p[1]);
        }
        g.strokeStyle = pass ? 'rgba(208,138,82,0.9)' : 'rgba(208,138,82,0.25)';
        g.setLineDash(pass ? [] : [3, 3]);
        g.stroke();
      }
      g.setLineDash([]);
      // seams
      const pts = Seams.CURVE.pts;
      const N = pts.length;
      for (let pass = 0; pass < 2; pass++) {
        for (let i = 0; i < N; i++) {
          const q0 = U.m3v(Rt, pts[i]), q1 = U.m3v(Rt, pts[(i + 1) % N]);
          const p0 = proj(q0), p1 = proj(q1);
          const front = p0[2] >= 0 && p1[2] >= 0;
          if ((pass === 1) !== front) continue;
          const th = Math.acos(U.clamp(U.dot(q0, vh), -1, 1));
          const inBand = Math.abs(th - ts) < sw * 1.2;
          g.strokeStyle = pass ? (inBand ? '#ffb070' : '#c4231f') : 'rgba(196,35,31,0.22)';
          g.lineWidth = pass ? (inBand ? 3.2 : 2.2) : 1.2;
          g.beginPath(); g.moveTo(p0[0], p0[1]); g.lineTo(p1[0], p1[1]); g.stroke();
        }
      }
      // spin axis
      const ax = st.axis;
      const a0 = proj(U.scale(ax, -1.45)), a1 = proj(U.scale(ax, 1.45));
      g.strokeStyle = C.ink; g.lineWidth = 1.5;
      g.beginPath(); g.moveTo(a0[0], a0[1]); g.lineTo(a1[0], a1[1]); g.stroke();
      const ang = Math.atan2(a1[1] - a0[1], a1[0] - a0[0]);
      g.fillStyle = C.ink; g.beginPath(); g.moveTo(a1[0], a1[1]);
      g.lineTo(a1[0] - 8 * Math.cos(ang - 0.4), a1[1] - 8 * Math.sin(ang - 0.4)); g.lineTo(a1[0] - 8 * Math.cos(ang + 0.4), a1[1] - 8 * Math.sin(ang + 0.4)); g.fill();
      // flow arrow
      const fy = cy + R + 9;
      g.strokeStyle = C.mute; g.lineWidth = 1; g.beginPath(); g.moveTo(cx - R, fy); g.lineTo(cx + R, fy); g.stroke();
      g.beginPath(); g.moveTo(cx + R, fy); g.lineTo(cx + R - 5, fy - 3); g.lineTo(cx + R - 5, fy + 3); g.fillStyle = C.mute; g.fill();
      g.font = FONT(500, 9, 'body'); g.fillStyle = C.mute; g.textAlign = 'center';
      g.fillText('AIRFLOW  ·  BALL TRAVELS ←', cx, fy + 11);
    }
  }

  // ------------------------------------------------------------- tilt dial
  class ClockDial {
    constructor(canvas, onChange) {
      this.c = canvas; this.onChange = onChange; this.val = 0; this.labels = null;
      const set = (ev) => {
        const r = canvas.getBoundingClientRect();
        const x = ev.clientX - r.left - r.width / 2, y = ev.clientY - r.top - r.height / 2;
        let a = Math.atan2(x, -y) / U.DEG;
        a = Math.round(U.wrap360(a) / 0.5) * 0.5; // 1-minute resolution
        if (!ev.shiftKey) a = Math.round(a / 2.5) * 2.5; // 5-minute snap unless Shift
        this.onChange && this.onChange(U.wrap360(a));
      };
      let down = false;
      canvas.addEventListener('pointerdown', (ev) => { down = true; canvas.setPointerCapture(ev.pointerId); set(ev); });
      canvas.addEventListener('pointermove', (ev) => { if (down) set(ev); });
      canvas.addEventListener('pointerup', () => { down = false; });
    }
    // win (optional): [[lo, hi], ...] unlocked display-degree spans (Career); the rest of the clock is shaded
    draw(val, labels, color, win) {
      this.val = val;
      const { g, w, h } = fit(this.c, 112);
      g.clearRect(0, 0, w, h);
      const cx = w / 2, cy = h / 2, R = Math.min(w, h) / 2 - 6;
      g.fillStyle = '#0e1619'; g.strokeStyle = C.rule; g.lineWidth = 1;
      g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.fill(); g.stroke();
      if (win) {
        const ang = (d) => (d - 90) * U.DEG;
        g.save();
        g.beginPath(); g.arc(cx, cy, R - 0.5, 0, Math.PI * 2); g.clip();
        g.fillStyle = 'rgba(109,125,128,0.22)';
        g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.fill();
        g.globalCompositeOperation = 'destination-out';
        for (const [a, b] of win) { g.beginPath(); g.moveTo(cx, cy); g.arc(cx, cy, R, ang(a), ang(b)); g.closePath(); g.fill(); }
        g.restore();
        g.strokeStyle = hexA(color || C.clay, 0.85); g.lineWidth = 3;
        for (const [a, b] of win) { g.beginPath(); g.arc(cx, cy, R - 1.5, ang(a), ang(b)); g.stroke(); }
      }
      for (let i = 0; i < 60; i++) {
        const a = (i / 60) * 2 * Math.PI, big = i % 5 === 0;
        g.strokeStyle = big ? C.dim : C.rule; g.lineWidth = big ? 1.4 : 1;
        g.beginPath(); g.moveTo(cx + Math.sin(a) * (R - (big ? 7 : 4)), cy - Math.cos(a) * (R - (big ? 7 : 4))); g.lineTo(cx + Math.sin(a) * R, cy - Math.cos(a) * R); g.stroke();
      }
      g.font = FONT(600, 10, 'data'); g.fillStyle = C.mute; g.textAlign = 'center'; g.textBaseline = 'middle';
      [[12, 0], [3, 90], [6, 180], [9, 270]].forEach(([n, d]) => g.fillText(n, cx + Math.sin(d * U.DEG) * (R - 16), cy - Math.cos(d * U.DEG) * (R - 16)));
      if (labels) {
        g.font = FONT(600, 8, 'body');
        g.fillStyle = C.clay;
        g.fillText(labels.left, cx - R * 0.52, cy + R * 0.38);
        g.fillText(labels.right, cx + R * 0.52, cy + R * 0.38);
      }
      const a = val * U.DEG;
      g.strokeStyle = color || C.stitch; g.lineWidth = 3; g.lineCap = 'round';
      g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + Math.sin(a) * (R - 12), cy - Math.cos(a) * (R - 12)); g.stroke();
      g.fillStyle = C.ink; g.beginPath(); g.arc(cx, cy, 3, 0, Math.PI * 2); g.fill();
      g.font = FONT(600, 13, 'data'); g.fillStyle = C.ink; g.textBaseline = 'alphabetic';
      g.fillText(U.tiltToClock(val), cx, cy + R * 0.66);
    }
  }

  // ------------------------------------------------------------- hover tooltip helper
  function attachHover(canvas, tipEl, hitFn) {
    canvas.addEventListener('pointermove', (ev) => {
      const r = canvas.getBoundingClientRect();
      const hit = hitFn(ev.clientX - r.left, ev.clientY - r.top);
      if (!hit) { tipEl.hidden = true; return; }
      tipEl.hidden = false; tipEl.innerHTML = hit.html;
      tipEl.style.left = hit.x + 'px'; tipEl.style.top = hit.y + 'px';
    });
    canvas.addEventListener('pointerleave', () => { tipEl.hidden = true; });
  }

  // ------------------------------------------------------------- movement chart
  class MovementChart {
    constructor(canvas, tip, onPick) {
      this.c = canvas; this.pts = []; this.onPick = onPick;
      attachHover(canvas, tip, (x, y) => {
        let best = null, bd = 14;
        for (const p of this.pts) { const d = Math.hypot(p.sx - x, p.sy - y); if (d < bd) { bd = d; best = p; } }
        return best ? { x: best.sx, y: best.sy, html: `<b>${best.name}</b><br>IVB ${U.fmtSigned(best.ivb)}″ · HB ${U.fmtSigned(best.hb)}″<br>SSW ${U.fmtSigned(best.sswV)}″ v · ${U.fmtSigned(best.sswH)}″ h` } : null;
      });
      canvas.addEventListener('click', (ev) => {
        const r = canvas.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
        for (const p of this.pts) if (Math.hypot(p.sx - x, p.sy - y) < 14) { this.onPick && this.onPick(p.i); return; }
      });
    }
    draw(items, selected) {
      const { g, w, h } = fit(this.c, 270);
      g.clearRect(0, 0, w, h);
      const padL = 40, padR = 10, padT = 12, padB = 26;
      const pw = w - padL - padR, ph = h - padT - padB;
      const lim = 25;
      const X = (v) => padL + ((v + lim) / (2 * lim)) * pw, Y = (v) => padT + ((lim - v) / (2 * lim)) * ph;
      g.font = FONT(400, 9, 'data'); g.textAlign = 'center'; g.textBaseline = 'top';
      for (let v = -20; v <= 20; v += 5) {
        g.strokeStyle = v === 0 ? 'rgba(236,230,214,0.22)' : C.grid; g.lineWidth = 1;
        g.beginPath(); g.moveTo(X(v), padT); g.lineTo(X(v), padT + ph); g.stroke();
        g.beginPath(); g.moveTo(padL, Y(v)); g.lineTo(padL + pw, Y(v)); g.stroke();
        if (v % 10 === 0) {
          g.fillStyle = C.mute; g.fillText(v, X(v), padT + ph + 4);
          g.textAlign = 'right'; g.textBaseline = 'middle'; g.fillText(v, padL - 5, Y(v)); g.textAlign = 'center'; g.textBaseline = 'top';
        }
      }
      g.font = FONT(600, 9, 'body'); g.fillStyle = C.mute;
      g.textAlign = 'left'; g.fillText('← GLOVE SIDE', padL + 2, padT + ph + 15);
      g.textAlign = 'right'; g.fillText('ARM SIDE →  in', padL + pw, padT + ph + 15);
      g.save(); g.translate(8, padT + ph / 2); g.rotate(-Math.PI / 2); g.textAlign = 'center'; g.fillText('INDUCED VERT. BREAK (in)', 0, 0); g.restore();
      this.pts = [];
      items.forEach((it) => {
        if (!it.a || !it.a.ok) return;
        const a = it.a;
        const sx = X(U.clamp(a.hbArm, -lim, lim)), sy = Y(U.clamp(a.ivb, -lim, lim));
        const mx = X(U.clamp(a.magHB, -lim, lim)), my = Y(U.clamp(a.magIVB, -lim, lim));
        // spin-based (Magnus-only) ghost → actual: the gap is the seam-shifted wake
        g.strokeStyle = 'rgba(236,230,214,0.35)'; g.lineWidth = 1; g.setLineDash([2, 2]);
        g.beginPath(); g.moveTo(mx, my); g.lineTo(sx, sy); g.stroke(); g.setLineDash([]);
        g.strokeStyle = it.color; g.lineWidth = 1.2; g.beginPath(); g.arc(mx, my, 3.5, 0, Math.PI * 2); g.stroke();
        const sel = it.i === selected;
        g.fillStyle = it.color; g.strokeStyle = C.surface; g.lineWidth = 2;
        g.beginPath(); g.arc(sx, sy, sel ? 8 : 6, 0, Math.PI * 2); g.fill(); g.stroke();
        if (sel) { g.strokeStyle = C.ink; g.lineWidth = 1.5; g.beginPath(); g.arc(sx, sy, 11, 0, Math.PI * 2); g.stroke(); }
        g.font = FONT(600, 10, 'data'); g.fillStyle = C.ink; g.textAlign = 'left'; g.textBaseline = 'middle';
        g.fillText(it.code, sx + 11, sy - 8);
        this.pts.push({ sx, sy, i: it.i, name: it.name, ivb: a.ivb, hb: a.hbArm, sswV: a.sswIVB, sswH: a.sswHB });
      });
    }
  }

  // ------------------------------------------------------------- flight inspector
  function drawFlight(canvas, a, color) {
    const { g, w, h } = fit(canvas, 230);
    g.clearRect(0, 0, w, h);
    if (!a || !a.ok) return;
    const padL = 34, padR = 10;
    const panels = [{ name: 'SIDE VIEW  height (ft)', top: 10, hgt: 96, comp: 2 }, { name: 'TOP VIEW  lateral (ft, catcher view)', top: 128, hgt: 74, comp: 0 }];
    const yMax = 56, X = (y) => padL + (1 - y / yMax) * (w - padL - padR);
    const lines = [
      { tr: a.traj, col: color, width: 2, dash: [] },
      { tr: a.ghostMagnus, col: 'rgba(236,230,214,0.7)', width: 1.2, dash: [5, 4] },
      { tr: a.ghostNoSpin, col: 'rgba(163,174,169,0.65)', width: 1.2, dash: [1.5, 3] },
    ];
    for (const pn of panels) {
      let lo = Infinity, hi = -Infinity;
      for (const L of lines) for (let i = 0; i < L.tr.n; i += 4) {
        const yy = L.tr.P[i * 3 + 1] / U.FT; if (yy < 0) continue;
        const v = L.tr.P[i * 3 + pn.comp] / U.FT; lo = Math.min(lo, v); hi = Math.max(hi, v);
      }
      if (pn.comp === 2) { lo = 0; hi = Math.max(hi, 6) + 0.3; } else { const m = Math.max(1.5, Math.abs(lo), Math.abs(hi)) + 0.2; lo = -m; hi = m; }
      const Y = (v) => pn.top + (1 - (v - lo) / (hi - lo)) * pn.hgt;
      g.strokeStyle = C.grid; g.lineWidth = 1;
      g.font = FONT(400, 9, 'data'); g.fillStyle = C.mute; g.textAlign = 'right'; g.textBaseline = 'middle';
      const stepV = pn.comp === 2 ? 2 : 1;
      for (let v = Math.ceil(lo / stepV) * stepV; v <= hi; v += stepV) { g.beginPath(); g.moveTo(padL, Y(v)); g.lineTo(w - padR, Y(v)); g.stroke(); g.fillText(v, padL - 5, Y(v)); }
      g.textAlign = 'left'; g.textBaseline = 'top'; g.font = FONT(600, 9, 'body'); g.fillStyle = C.mute;
      g.fillText(pn.name, padL + 2, pn.top - 9 > 0 ? pn.top - 9 : 0);
      // commit point (23.8 ft)
      g.strokeStyle = 'rgba(208,138,82,0.45)'; g.setLineDash([3, 3]);
      g.beginPath(); g.moveTo(X(23.8), pn.top); g.lineTo(X(23.8), pn.top + pn.hgt); g.stroke(); g.setLineDash([]);
      for (const L of lines) {
        g.strokeStyle = L.col; g.lineWidth = L.width; g.setLineDash(L.dash);
        g.beginPath();
        let started = false;
        for (let i = 0; i < L.tr.n; i += 2) {
          const yy = L.tr.P[i * 3 + 1] / U.FT;
          if (yy < 0) break;
          const v = L.tr.P[i * 3 + pn.comp] / U.FT;
          if (!started) { g.moveTo(X(yy), Y(v)); started = true; } else g.lineTo(X(yy), Y(v));
        }
        g.stroke();
      }
      g.setLineDash([]);
    }
    g.font = FONT(400, 9, 'data'); g.fillStyle = C.mute; g.textAlign = 'center'; g.textBaseline = 'top';
    for (const d of [50, 40, 30, 20, 10, 0]) g.fillText(d, X(d), 206);
    g.fillStyle = C.clay; g.fillText('commit', X(23.8), 216);
    g.fillStyle = C.mute; g.textAlign = 'left'; g.fillText('ft from plate →', padL, 216);
  }

  // ------------------------------------------------------------- zone chart (catcher view)
  function drawZone(canvas, zone, pitches) {
    const { g, w, h } = fit(canvas, 180);
    g.clearRect(0, 0, w, h);
    const cx = w / 2, scale = Math.min(w / 2.6, (h - 24) / 3.6); // px per ft
    const X = (xin) => cx + (xin / 12) * scale, Y = (zft) => h - 14 - (zft - 0.6) * scale;
    const hw = 8.5;
    g.fillStyle = 'rgba(236,230,214,0.04)';
    g.fillRect(X(-hw), Y(zone.top / U.FT), X(hw) - X(-hw), Y(zone.bot / U.FT) - Y(zone.top / U.FT));
    g.strokeStyle = 'rgba(236,230,214,0.6)'; g.lineWidth = 1.2;
    g.strokeRect(X(-hw), Y(zone.top / U.FT), X(hw) - X(-hw), Y(zone.bot / U.FT) - Y(zone.top / U.FT));
    g.strokeStyle = 'rgba(236,230,214,0.12)';
    for (const k of [1 / 3, 2 / 3]) {
      const x = X(-hw + 2 * hw * k); g.beginPath(); g.moveTo(x, Y(zone.top / U.FT)); g.lineTo(x, Y(zone.bot / U.FT)); g.stroke();
      const z = Y(zone.bot / U.FT + (zone.top - zone.bot) / U.FT * k); g.beginPath(); g.moveTo(X(-hw), z); g.lineTo(X(hw), z); g.stroke();
    }
    // plate
    g.fillStyle = '#d9d4c6'; g.beginPath(); g.moveTo(X(-hw), h - 8); g.lineTo(X(hw), h - 8); g.lineTo(X(hw), h - 5); g.lineTo(X(0), h - 1); g.lineTo(X(-hw), h - 5); g.closePath(); g.fill();
    const r = Math.max(4, (1.45 / 12) * scale);
    pitches.forEach((p, i) => {
      g.fillStyle = p.color; g.strokeStyle = C.surface; g.lineWidth = 1.5;
      g.beginPath(); g.arc(X(p.x), Y(p.z), r, 0, Math.PI * 2); g.fill(); g.stroke();
      if (p.n != null) { g.font = FONT(700, 9, 'data'); g.fillStyle = '#0c1215'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(p.n, X(p.x), Y(p.z) + 0.5); }
    });
  }

  // ------------------------------------------------------------- zone picker (catcher's view)
  // Click or drag to place a target. x in inches (+ toward first base), z in feet.
  class ZonePicker {
    constructor(canvas, onChange) {
      this.c = canvas; this.onChange = onChange; this.view = null;
      let down = false;
      const set = (ev) => {
        if (!this.view) return;
        const r = canvas.getBoundingClientRect(), v = this.view;
        const x = U.clamp((ev.clientX - r.left - v.cx) / v.s * 12, -20, 20);
        const z = U.clamp((v.base - (ev.clientY - r.top)) / v.s + v.z0, 0.5, 4.5);
        this.onChange && this.onChange({ x: Math.round(x * 2) / 2, z: Math.round(z * 20) / 20 });
      };
      canvas.addEventListener('pointerdown', (ev) => { down = true; canvas.setPointerCapture(ev.pointerId); set(ev); });
      canvas.addEventListener('pointermove', (ev) => { if (down) set(ev); });
      canvas.addEventListener('pointerup', () => { down = false; });
    }

  }

  // ------------------------------------------------------------- spray chart
  const EV_BINS = [[0, '#4a5a5e', '< 85'], [85, '#8a6a4f', '85–95'], [95, '#c07a43', '95–105'], [105, '#f0a35e', '105+']];

    constructor(canvas, tip) {

    draw(stadium, balls) {
      const { g, w, h } = fit(this.c, 230);

        g.beginPath(); g.arc(sx, sy, 4.5, 0, Math.PI * 2); g.fill(); g.stroke();

      }
    }
  }

  // ------------------------------------------------------------- bat profile
  function drawBat(canvas, bat, ballMass) {
    const { g, w, h } = fit(canvas, 92);
    g.clearRect(0, 0, w, h);
    const padL = 10, padR = 10, L = bat.L;
    const X = (s) => padL + (s / L) * (w - padL - padR);
    const cy = 38, sc = 340; // px per meter radius
    // COR heat along the bat (q at each point)
    const N = 120;
    for (let i = 0; i < N; i++) {
      const s0 = (i / N) * L, s1 = ((i + 1) / N) * L;
      const q = BP.Batting.qAt(bat, (s0 + s1) / 2, ballMass);
      const t = U.clamp((q + 0.05) / 0.3, 0, 1);
      const r = bat.radius((s0 + s1) / 2) * sc;
      const lum = 26 + t * 50;
      g.fillStyle = `hsl(${24 + t * 6}, ${30 + t * 45}%, ${lum}%)`;
      g.fillRect(X(s0), cy - r, X(s1) - X(s0) + 0.6, 2 * r);
    }

    g.beginPath();
    for (let i = 0; i <= N; i++) { const s = (i / N) * L; g.lineTo(X(s), cy - bat.radius(s) * sc); }
    for (let i = N; i >= 0; i--) { const s = (i / N) * L; g.lineTo(X(s), cy + bat.radius(s) * sc); }

    const mark = (s, label, col, below) => {
      g.strokeStyle = col; g.fillStyle = col; g.lineWidth = 1;
      g.beginPath(); g.moveTo(X(s), cy + (below ? 16 : -16)); g.lineTo(X(s), cy + (below ? 26 : -26)); g.stroke();
      g.font = FONT(500, 9, 'data'); g.textAlign = 'center'; g.textBaseline = below ? 'top' : 'bottom';
      g.fillText(label, X(s), cy + (below ? 28 : -28));
    };

    mark(bat.scm, 'balance ' + (bat.scm / U.IN).toFixed(1) + '″', C.clay, true);
    g.font = FONT(500, 9, 'body'); g.fillStyle = C.mute; g.textAlign = 'left'; g.textBaseline = 'bottom';
    g.fillText('KNOB', padL, h - 2); g.textAlign = 'right'; g.fillText('END CAP', w - padR, h - 2);
  }

  // ------------------------------------------------------------- delivery meter
  // Scoring windows (presentation only: the physical error is the continuous miss, not the grade)
  const GRADE = {
    perfect: { label: 'PERFECT', color: '#ffd77a' },
    great: { label: 'GREAT', color: '#6cc08b' },
    good: { label: 'GOOD', color: '#d08a52' },
    miss: { label: 'MISS', color: '#ef6a57' },

  function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

  function drawMeter(canvas, m, now, dt) {

        }

        const bx = x0 + 16, bw = cw - 32, cy = 62;

        g.strokeStyle = '#1b282d'; g.lineWidth = 6; g.lineCap = 'round';

          const d = BANDS.release[b];

        }
        const rv = m.releaseLocked != null ? m.releaseLocked : m.releasePos;
        if (rv != null && (m.stage >= 3)) {
          const u = U.clamp(rv, 0, 1.15);
          // motion streak
          const tr = m.trail2 || [];
          for (let k = 0; k < tr.length; k++) { const q = U.clamp(tr[k], 0, 1.15); g.fillStyle = `rgba(236,230,214,${0.05 + 0.3 * (k / tr.length)})`; g.beginPath(); g.arc(X(q), yAt(q), 3 + 2 * (k / tr.length), 0, Math.PI * 2); g.fill(); }
          const col = lock ? GRADE[lock.grade].color : C.ink;
          g.fillStyle = col;
          if (lock && lock.grade === 'perfect') { g.shadowColor = col; g.shadowBlur = 14; }
          g.beginPath(); g.arc(X(u), yAt(u), 6.5, 0, Math.PI * 2); g.fill(); g.shadowBlur = 0;
          tip = [X(u), yAt(u)];
        }
      }
      // footer: grade, or the active key hint
      g.textAlign = 'center'; g.textBaseline = 'alphabetic';
      if (lock) {
        const k = Math.min(1, la / 0.22);
        const sc = 1 + 0.6 * (1 - k) * (1 - k);
        g.save(); g.translate(cx, h - 12); g.scale(sc, sc);
        g.font = FONT(800, 19, 'display');
        g.fillStyle = GRADE[lock.grade].color;
        if (lock.grade === 'perfect') { g.shadowColor = '#ffd77a'; g.shadowBlur = 10 + 10 * (1 - k); }

          g.strokeStyle = hexA(GRADE[lock.grade].color, 1 - k2); g.lineWidth = 2.5 * (1 - k2) + 0.5;

        g.font = FONT(600, 9, 'data');
        const kx = cx, ky = h - 15;
        g.globalAlpha = 0.6 + 0.4 * pulse;
        rr(g, kx - 26, ky - 10, 52, 15, 4); g.fillStyle = '#1e2c32'; g.fill(); g.strokeStyle = C.rule; g.stroke();

        g.globalAlpha = 1;

    for (let s = m.sparks.length - 1; s >= 0; s--) {
      const p = m.sparks[s];
      p.age += dt || 0.016;
      if (p.age > p.life) { m.sparks.splice(s, 1); continue; }
      p.vy += 260 * (dt || 0.016); p.x += p.vx * (dt || 0.016); p.y += p.vy * (dt || 0.016); p.vx *= 0.96;

  }

    const n = parseInt(hex.slice(1), 16);

  }

  // ------------------------------------------------------------- attack-angle gauge
  function drawAttack(canvas, attack, vaa) {

    const cx = 14, cy = h / 2 + 4;

})(typeof window !== 'undefined' ? window : globalThis);

  function newEpisode() {
    const S = App.S, rl = roles();
    const E = { mode: S.mode, rl, zone: App.currentZone(), batter: rl.batter, sw: null, hit: null, bb: null, play: null, outcome: null };
    if (rl.pitcherUser) {
      E.pitcher = Object.assign({}, S.pitcher);

      E.target = Object.assign({}, E.pitch.target);
      E.intended = Object.assign({}, E.pitch.target);
      E.designVelo = E.pitch.velo;
      if (App.inCareer()) {
        // edge of the envelope (any career pitch); fatigue only in a live game
        E.edge = Career.edgeOf(Career.C, E.pitch, E.pitcher);
        const cs = S.mode === 'game' && App.game && App.game.on ? App.game.cs : null;
        if (cs) {
          E.cs = cs;
          const f = Career.fatigueOf(cs.stamina), n = App.game.pitchCount;

            E.target.x += 3 * f * Math.sin(n * 1.7 + 0.4);
            E.target.z += ((3 * f) / 12) * Math.cos(n * 2.3);

          E.fatigue = f;
        }
      }
    } else {
      const arch = S.mode === 'cage' ? App.cageArch() : rl.reliever ? App.game.reliever : App.game.arch;
      const count = S.mode === 'cage' ? App.cage.count : App.game.count;
      const cg = S.mode === 'cage' ? S.cage : null;
      let a2 = arch;
      if (cg && cg.pick !== 'all') {
        // a specific pitch ('p<index>') or a category ('fast' | 'brk' | 'off')
        const idx = /^p\d+$/.test(cg.pick) ? +cg.pick.slice(1) : -1;
        const f = idx >= 0 ? (arch.arsenal[idx] ? [arch.arsenal[idx]] : []) : arch.arsenal.filter((p) => AI.GROUP[p.type] === cg.pick);
        if (f.length) a2 = Object.assign({}, arch, { arsenal: f });
      }
      const ch = AI.choosePitch(a2, count, R.rng, rl.batter.hand);
      let target = ch.target, exec = ch.exec;
      if (cg) {
        // practice controls: fixed spot and/or reduced command scatter (0 = the same release every time)
        if (cg.loc === 'fixed') target = { x: cg.target.x, z: cg.target.z };
        const k = U.clamp(cg.scatter, 0, 1);
